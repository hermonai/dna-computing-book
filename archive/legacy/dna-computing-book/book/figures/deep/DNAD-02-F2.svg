<svg xmlns="http://www.w3.org/2000/svg" width="900" height="362" viewBox="0 0 900 362" role="img" aria-labelledby="title desc"><title id="title">DNAD-02-F2: Four routes, four logical cases</title><desc id="desc">Why are separate predicates needed? An all-vertex sequence can still use a forbidden edge.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#176CA4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="22" y="32" font-size="20" font-weight="bold" text-anchor="start" fill="#18344A">Route</text><text x="367" y="32" font-size="20" font-weight="bold" text-anchor="start" fill="#18344A">Edges</text><text x="497" y="32" font-size="20" font-weight="bold" text-anchor="start" fill="#18344A">Occurrences</text><text x="662" y="32" font-size="20" font-weight="bold" text-anchor="start" fill="#18344A">Coverage</text><rect x="10" y="50" width="880" height="70" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="22" y="79" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">0 1 2 3 4 5 6</text><text x="367" y="79" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">legal</text><text x="497" y="79" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">7</text><text x="662" y="79" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">all; witness</text><rect x="10" y="125" width="880" height="70" rx="8" fill="#FFFFFF" stroke="#ABC1CF" stroke-width="1.5"/><text x="22" y="154" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">0 1 3 4 5 6</text><text x="367" y="154" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">legal</text><text x="497" y="154" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">6</text><text x="662" y="154" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">2 absent</text><rect x="10" y="200" width="880" height="70" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="22" y="229" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">0 3 2 3 4 5 6</text><text x="367" y="229" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">legal</text><text x="497" y="229" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">7</text><text x="662" y="229" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">1 absent; 3 twice</text><rect x="10" y="275" width="880" height="70" rx="8" fill="#FFFFFF" stroke="#ABC1CF" stroke-width="1.5"/><text x="22" y="304" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">0 1 2 4 3 5 6</text><text x="367" y="304" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">illegal</text><text x="497" y="304" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">7</text><text x="662" y="304" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">all; not a witness</text></g></svg>
