<svg xmlns="http://www.w3.org/2000/svg" width="900" height="337" viewBox="0 0 900 337" role="img" aria-labelledby="title desc"><title id="title">DNAD-01-F10: The field expanded its programming mechanisms</title><desc id="desc">Map search/filter, automata, CRNs/circuits and self-assembly; keep storage and learned DNA models distinct. Selected established directions, not an exhaustive latest survey.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#176CA4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><rect x="10.0" y="15" width="279.3333333333333" height="116" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="26.0" y="50" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">1  Search</text><text x="26.0" y="90" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">candidate selection</text><rect x="303.3333333333333" y="15" width="279.3333333333333" height="116" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="319.33333" y="50" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">2  Automata</text><text x="319.33333" y="90" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">state transitions</text><rect x="596.6666666666666" y="15" width="279.3333333333333" height="116" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="612.66667" y="50" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">3  CRNs</text><text x="612.66667" y="90" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">reaction dynamics</text><rect x="10.0" y="156" width="279.3333333333333" height="116" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="26.0" y="191" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">4  Circuits</text><text x="26.0" y="231" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">composed gates</text><rect x="303.3333333333333" y="156" width="279.3333333333333" height="116" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="319.33333" y="191" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">5  Assembly</text><text x="319.33333" y="231" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">local geometry</text><rect x="596.6666666666666" y="156" width="279.3333333333333" height="116" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="612.66667" y="191" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">6  Simulation</text><text x="612.66667" y="231" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">digital models</text><text x="450" y="312" font-size="21" font-weight="normal" text-anchor="middle" fill="#18344A">Storage and learned DNA representations are related, distinct activities.</text></g></svg>
