<svg xmlns="http://www.w3.org/2000/svg" width="900" height="510" viewBox="0 0 900 510" role="img" aria-labelledby="title desc"><title id="title">DNAD-01-F9: Candidate space becomes a material budget</title><desc id="desc">Plot log10 factorial candidate counts for fixed endpoints with marked axes; pair with molecule-budget equation. Analytical counts, not measured yield, speed or energy.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#176CA4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="450" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#18344A">Fixed endpoints: internal vertex orders = (n − 2)!</text><path d="M100,340 L790,340" fill="none" stroke="#176CA4" stroke-width="3"/><path d="M100,340 L100,70" fill="none" stroke="#176CA4" stroke-width="3"/><path d="M100,340 L790,340" fill="none" stroke="#DCE4E9" stroke-width="1"/><text x="82" y="346" font-size="18" font-weight="normal" text-anchor="end" fill="#18344A">0</text><path d="M100,290 L790,290" fill="none" stroke="#DCE4E9" stroke-width="1"/><text x="82" y="296" font-size="18" font-weight="normal" text-anchor="end" fill="#18344A">5</text><path d="M100,240 L790,240" fill="none" stroke="#DCE4E9" stroke-width="1"/><text x="82" y="246" font-size="18" font-weight="normal" text-anchor="end" fill="#18344A">10</text><path d="M100,190 L790,190" fill="none" stroke="#DCE4E9" stroke-width="1"/><text x="82" y="196" font-size="18" font-weight="normal" text-anchor="end" fill="#18344A">15</text><path d="M100,140 L790,140" fill="none" stroke="#DCE4E9" stroke-width="1"/><text x="82" y="146" font-size="18" font-weight="normal" text-anchor="end" fill="#18344A">20</text><path d="M100,90 L790,90" fill="none" stroke="#DCE4E9" stroke-width="1"/><text x="82" y="96" font-size="18" font-weight="normal" text-anchor="end" fill="#18344A">25</text><circle cx="100" cy="326.19789" r="5" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="100" y="334.19789" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4"></text><text x="100" y="371" font-size="20" font-weight="normal" text-anchor="middle" fill="#18344A">6</text><circle cx="236" cy="293.94479" r="5" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="236" y="301.94479" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4"></text><text x="236" y="371" font-size="20" font-weight="normal" text-anchor="middle" fill="#18344A">10</text><circle cx="406" cy="242.0572" r="5" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="406" y="250.0572" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4"></text><text x="406" y="371" font-size="20" font-weight="normal" text-anchor="middle" fill="#18344A">15</text><circle cx="576" cy="181.93659" r="5" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="576" y="189.93659" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4"></text><text x="576" y="371" font-size="20" font-weight="normal" text-anchor="middle" fill="#18344A">20</text><circle cx="746" cy="115.87506" r="5" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="746" y="123.87506" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4"></text><text x="746" y="371" font-size="20" font-weight="normal" text-anchor="middle" fill="#18344A">25</text><path d="M100,326.19789 L236,293.94479" fill="none" stroke="#176CA4" stroke-width="3"/><path d="M236,293.94479 L406,242.0572" fill="none" stroke="#176CA4" stroke-width="3"/><path d="M406,242.0572 L576,181.93659" fill="none" stroke="#176CA4" stroke-width="3"/><path d="M576,181.93659 L746,115.87506" fill="none" stroke="#176CA4" stroke-width="3"/><text x="450" y="412" font-size="22" font-weight="normal" text-anchor="middle" fill="#18344A">n: number of vertices</text><text x="110" y="62" font-size="20" font-weight="normal" text-anchor="start" fill="#18344A">log10(candidate count)</text><text x="450" y="452" font-size="22" font-weight="normal" text-anchor="middle" fill="#18344A">M ≥ ln(δ) / ln(1 − p)   under independent draws, 0 &lt; p &lt; 1.</text><text x="450" y="490" font-size="20" font-weight="normal" text-anchor="middle" fill="#5B6874">A count is not a concentration, reaction time or success probability.</text></g></svg>
