<svg xmlns="http://www.w3.org/2000/svg" width="900" height="481" viewBox="0 0 900 481" role="img" aria-labelledby="title desc"><title id="title">DNAD-02-F8: Two bead operations, different retained material</title><desc id="desc">Which phase is kept, and why? Do not label biotin as the sequence-recognition element.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#176CA4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><circle cx="55" cy="82" r="30" fill="#DDE5EB" stroke="#5B6874" stroke-width="2.5"/><text x="55" y="90" font-size="24" font-weight="bold" text-anchor="middle" fill="#5B6874"></text><path d="M85,82 L125,82" fill="none" stroke="#7147A8" stroke-width="3"/><text x="140" y="47" font-size="24" font-weight="bold" text-anchor="start" fill="#18344A">Prepare single strands</text><text x="140" y="87" font-size="22" font-weight="normal" text-anchor="start" fill="#18344A">bead—biotin—reverse strand</text><text x="140" y="126" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">denature → recover free forward strand</text><circle cx="55" cy="222" r="30" fill="#DDE5EB" stroke="#5B6874" stroke-width="2.5"/><text x="55" y="230" font-size="24" font-weight="bold" text-anchor="middle" fill="#5B6874"></text><path d="M85,222 L125,222" fill="none" stroke="#7147A8" stroke-width="3"/><text x="140" y="187" font-size="24" font-weight="bold" text-anchor="start" fill="#18344A">Recognize required vertex</text><text x="140" y="227" font-size="22" font-weight="normal" text-anchor="start" fill="#18344A">bead—biotin—complementary probe</text><text x="140" y="266" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">target binds probe; wash away unbound</text><circle cx="55" cy="362" r="30" fill="#DDE5EB" stroke="#5B6874" stroke-width="2.5"/><text x="55" y="370" font-size="24" font-weight="bold" text-anchor="middle" fill="#5B6874"></text><path d="M85,362 L125,362" fill="none" stroke="#7147A8" stroke-width="3"/><text x="140" y="327" font-size="24" font-weight="bold" text-anchor="start" fill="#18344A">Recover retained target</text><text x="140" y="367" font-size="22" font-weight="normal" text-anchor="start" fill="#18344A">bead keeps its attached probe</text><text x="140" y="406" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">denature → target returns to solution</text><text x="450" y="460" font-size="19" font-weight="normal" text-anchor="middle" fill="#5B6874">Biotin attaches. Complementarity recognizes. The retained phase changes with the step.</text></g></svg>
