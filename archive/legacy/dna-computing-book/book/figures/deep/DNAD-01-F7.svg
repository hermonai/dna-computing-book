<svg xmlns="http://www.w3.org/2000/svg" width="900" height="455" viewBox="0 0 900 455" role="img" aria-labelledby="title desc"><title id="title">DNAD-01-F7: Predicates meet laboratory operations</title><desc id="desc">Map joining, endpoints, size, vertex presence and evidence to operations and failure modes. Operations approximate predicates; distinguish annealing, covalent ligation, amplification and measurement.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#176CA4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><rect x="10" y="20" width="880" height="65" rx="8" fill="#F0F6FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="26" y="61" font-size="22" font-weight="bold" text-anchor="start" fill="#18344A">Join</text><text x="190" y="61" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">Ligase seals a nick</text><text x="550" y="61" font-size="20" font-weight="normal" text-anchor="start" fill="#5B6874">incompatible / unjoined ends</text><rect x="10" y="97" width="880" height="65" rx="8" fill="#FFFFFF" stroke="#ABC1CF" stroke-width="1.5"/><text x="26" y="138" font-size="22" font-weight="bold" text-anchor="start" fill="#18344A">Endpoints</text><text x="190" y="138" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">Primers + amplification</text><text x="550" y="138" font-size="20" font-weight="normal" text-anchor="start" fill="#5B6874">off-target amplification</text><rect x="10" y="174" width="880" height="65" rx="8" fill="#F0F6FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="26" y="215" font-size="22" font-weight="bold" text-anchor="start" fill="#18344A">Length</text><text x="190" y="215" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">Gel size fraction</text><text x="550" y="215" font-size="20" font-weight="normal" text-anchor="start" fill="#5B6874">overlapping bands</text><rect x="10" y="251" width="880" height="65" rx="8" fill="#FFFFFF" stroke="#ABC1CF" stroke-width="1.5"/><text x="26" y="292" font-size="22" font-weight="bold" text-anchor="start" fill="#18344A">Contains B</text><text x="190" y="292" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">Complementary capture</text><text x="550" y="292" font-size="20" font-weight="normal" text-anchor="start" fill="#5B6874">loss / nonspecific retention</text><rect x="10" y="328" width="880" height="65" rx="8" fill="#F0F6FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="26" y="369" font-size="22" font-weight="bold" text-anchor="start" fill="#18344A">Witness</text><text x="190" y="369" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">Decoded order + verifier</text><text x="550" y="369" font-size="20" font-weight="normal" text-anchor="start" fill="#5B6874">ambiguous mixed signal</text><text x="450" y="435" font-size="20" font-weight="normal" text-anchor="middle" fill="#18344A">Predicate     /     intended physical mechanism     /     possible failure</text></g></svg>
