<svg xmlns="http://www.w3.org/2000/svg" width="900" height="412" viewBox="0 0 900 412" role="img" aria-labelledby="title desc"><title id="title">DNAD-01-F1: Computing across three descriptions</title><desc id="desc">Keep graph constraints, molecular operations and decoded evidence in separate lanes. A diagram of representation is not a claim that the physical process implements it perfectly.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#176CA4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><rect x="15" y="15" width="870" height="108" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="31" y="50" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">FORMAL</text><text x="31" y="90" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">Graph + predicates</text><text x="31" y="119" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">A sequence is a witness</text><rect x="15" y="142" width="870" height="108" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="31" y="177" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">PHYSICAL</text><text x="31" y="217" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">Strands + reactions</text><text x="31" y="246" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">A sample yields a signal</text><rect x="15" y="269" width="870" height="108" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="31" y="304" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">INTERPRETIVE</text><text x="31" y="344" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">Decode + independent check</text><text x="31" y="373" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">The signal supports a claim</text></g></svg>
