<svg xmlns="http://www.w3.org/2000/svg" width="900" height="335" viewBox="0 0 900 335" role="img" aria-labelledby="title desc">
<title id="title">DNAU-01-F6: The route from counting to molecules</title>
<desc id="desc">Later chapters supply missing prerequisites before difficult applications. Planned chapters must not be presented as already delivered; arrows are teaching order.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176CA4"/></marker></defs>
<rect width="900" height="335" fill="white"/>
<g font-family="DejaVu Sans, sans-serif"><rect x="10" y="20" width="280" height="250" rx="10" fill="#EDF5FA" stroke="#9DB6C7" stroke-width="1.5"/><text x="150" y="61" font-size="21" font-weight="bold" text-anchor="middle" fill="#172F43">1  REPRESENT</text><text x="150" y="106" font-size="23" font-weight="normal" text-anchor="middle" fill="#172F43">Chapters 2–6</text><text x="150" y="170" font-size="21" font-weight="normal" text-anchor="middle" fill="#172F43">Symbols, procedures,</text><text x="150" y="199" font-size="21" font-weight="normal" text-anchor="middle" fill="#172F43">small programs</text><rect x="310" y="20" width="280" height="250" rx="10" fill="#EDF5FA" stroke="#9DB6C7" stroke-width="1.5"/><text x="450" y="61" font-size="21" font-weight="bold" text-anchor="middle" fill="#172F43">2  UNDERSTAND</text><text x="450" y="106" font-size="23" font-weight="normal" text-anchor="middle" fill="#172F43">Chapters 7–20</text><text x="450" y="170" font-size="21" font-weight="normal" text-anchor="middle" fill="#172F43">Molecules and</text><text x="450" y="199" font-size="21" font-weight="normal" text-anchor="middle" fill="#172F43">controlled operations</text><rect x="610" y="20" width="280" height="250" rx="10" fill="#EDF5FA" stroke="#9DB6C7" stroke-width="1.5"/><text x="750" y="61" font-size="21" font-weight="bold" text-anchor="middle" fill="#172F43">3  COMBINE &amp; TEST</text><text x="750" y="106" font-size="23" font-weight="normal" text-anchor="middle" fill="#172F43">Chapters 21–36</text><text x="750" y="170" font-size="21" font-weight="normal" text-anchor="middle" fill="#172F43">DNA methods, limits,</text><text x="750" y="199" font-size="21" font-weight="normal" text-anchor="middle" fill="#172F43">and evidence</text><path d="M268,235 L332,235" fill="none" stroke="#176CA4" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M568,235 L632,235" fill="none" stroke="#176CA4" stroke-width="2.5" marker-end="url(#arrow)"/><text x="450" y="311" font-size="21" font-weight="normal" text-anchor="middle" fill="#172F43">Arrows: teaching order. These later chapters are still planned.</text></g></svg>
