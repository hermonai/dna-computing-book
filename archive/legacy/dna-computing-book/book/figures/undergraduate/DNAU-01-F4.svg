<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="title desc">
<title id="title">DNAU-01-F4: From molecule to written order</title>
<desc id="desc">Letters describe an ordered molecular structure; they are not ink inside a cell. Not a chemical structure, complete DNA molecule, or strand-polarity lesson. Draw no misleading helix.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176CA4"/></marker></defs>
<rect width="900" height="400" fill="white"/>
<g font-family="DejaVu Sans, sans-serif"><rect x="10" y="15" width="880" height="135" rx="10" fill="#EDF5FA" stroke="#9DB6C7" stroke-width="1.5"/><text x="35" y="48" font-size="22" font-weight="bold" text-anchor="start" fill="#172F43">MOLECULAR STRUCTURE — schematic strand segment</text><path d="M155,105 L725,105" stroke="#176CA4" stroke-width="5" fill="none"/><rect x="154.0" y="85" width="42" height="40" rx="10" fill="#FFFFFF" stroke="#9DB6C7" stroke-width="1.5"/><text x="175.0" y="113" font-size="23" font-weight="bold" text-anchor="middle" fill="#172F43">A</text><rect x="330.66666666666663" y="85" width="42" height="40" rx="10" fill="#FFFFFF" stroke="#9DB6C7" stroke-width="1.5"/><text x="351.66666666666663" y="113" font-size="23" font-weight="bold" text-anchor="middle" fill="#172F43">C</text><rect x="507.33333333333326" y="85" width="42" height="40" rx="10" fill="#FFFFFF" stroke="#9DB6C7" stroke-width="1.5"/><text x="528.3333333333333" y="113" font-size="23" font-weight="bold" text-anchor="middle" fill="#172F43">G</text><rect x="684.0" y="85" width="42" height="40" rx="10" fill="#FFFFFF" stroke="#9DB6C7" stroke-width="1.5"/><text x="705.0" y="113" font-size="23" font-weight="bold" text-anchor="middle" fill="#172F43">T</text><path d="M450,165 L450,230" fill="none" stroke="#176CA4" stroke-width="2.5" marker-end="url(#arrow)"/><text x="450.0" y="185.5" font-size="20" font-weight="normal" text-anchor="middle" fill="#172F43">write the displayed order</text><rect x="170" y="243" width="560" height="70" rx="10" fill="#FFFFFF" stroke="#9DB6C7" stroke-width="1.5"/><text x="450" y="286" font-size="32" font-weight="bold" text-anchor="middle" fill="#172F43">A C G T</text><text x="450" y="347" font-size="22" font-weight="normal" text-anchor="middle" fill="#172F43">Letters describe parts; they are not letters inside the molecule.</text><text x="450" y="379" font-size="20" font-weight="normal" text-anchor="middle" fill="#172F43">Not a complete chemical drawing; strand direction comes later.</text></g></svg>
