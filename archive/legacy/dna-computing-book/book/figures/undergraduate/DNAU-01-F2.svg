<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-labelledby="title desc">
<title id="title">DNAU-01-F2: One rule, one intended result</title>
<desc id="desc">An unclear instruction permits different results even when the start is identical. Do not imply all computation must have a unique output; this is a deterministic example.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176CA4"/></marker></defs>
<rect width="900" height="340" fill="white"/>
<g font-family="DejaVu Sans, sans-serif"><rect x="10" y="15" width="880" height="100" rx="10" fill="#FFF6E7" stroke="#9DB6C7" stroke-width="1.5"/><text x="35" y="50" font-size="24" font-weight="bold" text-anchor="start" fill="#172F43">UNCLEAR: start at 3; add more</text><text x="35" y="89" font-size="22" font-weight="normal" text-anchor="start" fill="#172F43">Add one: 4     or     add two: 5     — both follow the words.</text><path d="M450,123 L450,171" fill="none" stroke="#176CA4" stroke-width="2.5" marker-end="url(#arrow)"/><text x="450.0" y="135.0" font-size="20" font-weight="normal" text-anchor="middle" fill="#172F43">make the rule precise</text><rect x="10" y="180" width="880" height="100" rx="10" fill="#EDF5FA" stroke="#9DB6C7" stroke-width="1.5"/><text x="35" y="216" font-size="24" font-weight="bold" text-anchor="start" fill="#172F43">EXPLICIT: start at 3; add exactly 2</text><text x="35" y="255" font-size="22" font-weight="normal" text-anchor="start" fill="#172F43">One completed application gives 5, not 4 and not 7.</text><text x="450" y="326" font-size="22" font-weight="normal" text-anchor="middle" fill="#172F43">This example specifies one rule and one application.</text></g></svg>
