<svg xmlns="http://www.w3.org/2000/svg" width="900" height="335" viewBox="0 0 900 335" role="img" aria-labelledby="title desc">
<title id="title">DNAU-01-F3: A quantity is not its carrier</title>
<desc id="desc">Representations agree only because their reading conventions are stated. Do not equate information with physical shape or give a formal information measure.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176CA4"/></marker></defs>
<rect width="900" height="335" fill="white"/>
<g font-family="DejaVu Sans, sans-serif"><rect x="10" y="20" width="280" height="260" rx="10" fill="#EDF5FA" stroke="#9DB6C7" stroke-width="1.5"/><text x="150" y="60" font-size="22" font-weight="bold" text-anchor="middle" fill="#172F43">Count objects</text><circle cx="80" cy="133" r="17" fill="#D5E9F5" stroke="#176CA4" stroke-width="2"/><text x="80" y="140" font-size="20" font-weight="normal" text-anchor="middle" fill="#172F43">1</text><circle cx="145" cy="133" r="17" fill="#D5E9F5" stroke="#176CA4" stroke-width="2"/><text x="145" y="140" font-size="20" font-weight="normal" text-anchor="middle" fill="#172F43">2</text><circle cx="210" cy="133" r="17" fill="#D5E9F5" stroke="#176CA4" stroke-width="2"/><text x="210" y="140" font-size="20" font-weight="normal" text-anchor="middle" fill="#172F43">3</text><text x="150" y="212" font-size="23" font-weight="bold" text-anchor="middle" fill="#172F43">Means three</text><text x="150" y="249" font-size="20" font-weight="normal" text-anchor="middle" fill="#172F43">one object counts</text><text x="150" y="277" font-size="20" font-weight="normal" text-anchor="middle" fill="#172F43">as one</text><rect x="310" y="20" width="280" height="260" rx="10" fill="#EDF5FA" stroke="#9DB6C7" stroke-width="1.5"/><text x="450" y="60" font-size="22" font-weight="bold" text-anchor="middle" fill="#172F43">Read a numeral</text><text x="450" y="160" font-size="76" font-weight="bold" text-anchor="middle" fill="#172F43">3</text><text x="450" y="212" font-size="23" font-weight="bold" text-anchor="middle" fill="#172F43">Means three</text><text x="450" y="249" font-size="20" font-weight="normal" text-anchor="middle" fill="#172F43">decimal numeral convention</text><text x="450" y="277" font-size="20" font-weight="normal" text-anchor="middle" fill="#172F43"></text><rect x="610" y="20" width="280" height="260" rx="10" fill="#EDF5FA" stroke="#9DB6C7" stroke-width="1.5"/><text x="750" y="60" font-size="22" font-weight="bold" text-anchor="middle" fill="#172F43">Read marked cells</text><rect x="649" y="102" width="62" height="62" rx="10" fill="#FFFFFF" stroke="#9DB6C7" stroke-width="1.5"/><text x="680" y="145" font-size="34" font-weight="normal" text-anchor="middle" fill="#172F43">×</text><rect x="719" y="102" width="62" height="62" rx="10" fill="#FFFFFF" stroke="#9DB6C7" stroke-width="1.5"/><text x="750" y="145" font-size="34" font-weight="normal" text-anchor="middle" fill="#172F43">×</text><rect x="789" y="102" width="62" height="62" rx="10" fill="#FFFFFF" stroke="#9DB6C7" stroke-width="1.5"/><text x="820" y="145" font-size="34" font-weight="normal" text-anchor="middle" fill="#172F43">×</text><text x="750" y="212" font-size="23" font-weight="bold" text-anchor="middle" fill="#172F43">Means three</text><text x="750" y="249" font-size="20" font-weight="normal" text-anchor="middle" fill="#172F43">one mark counts</text><text x="750" y="277" font-size="20" font-weight="normal" text-anchor="middle" fill="#172F43">as one</text></g></svg>
