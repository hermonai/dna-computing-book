[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dna-computing-book"
version = "0.1.0"
description = "Executable reference material for DNA Computing: Foundations, Models, and the Road to Genomic Computation"
requires-python = ">=3.11"
dependencies = ["torch>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.setuptools.packages.find]
where = ["code/minidna"]

[tool.pytest.ini_options]
pythonpath = ["code/minidna"]
testpaths = ["code/minidna/tests", "tests"]
addopts = "-q"

