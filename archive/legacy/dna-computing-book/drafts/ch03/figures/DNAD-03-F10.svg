<svg xmlns="http://www.w3.org/2000/svg" width="900" height="651" viewBox="0 0 900 651" role="img" aria-labelledby="title desc"><title id="title">DNAD-03-F10: No signal is not a universal negative</title><desc id="desc">A missing signal needs coverage, retention and readout assumptions. This is not a calibrated experimental error probability.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#176CA4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="450" y="35" font-size="25" font-weight="bold" text-anchor="middle" fill="#18344A">One observation, several possible physical histories</text><text x="130" y="100" font-size="18" font-weight="bold" text-anchor="middle" fill="#18344A">NOT GENERATED</text><path d="M60,135 L60,230 Q130,305 200,230 L200,135" fill="#EDF5FA" stroke="#5B6874" stroke-width="3"/><path d="M55,135 L205,135" fill="none" stroke="#5B6874" stroke-width="3"/><text x="130" y="310" font-size="18" font-weight="bold" text-anchor="middle" fill="#18344A">no recorded signal</text><text x="445" y="100" font-size="18" font-weight="bold" text-anchor="middle" fill="#18344A">LOST IN PROCESSING</text><path d="M375,135 L375,230 Q445,305 515,230 L515,135" fill="#EDF5FA" stroke="#5B6874" stroke-width="3"/><path d="M370,135 L520,135" fill="none" stroke="#5B6874" stroke-width="3"/><path d="M402,165 q12,-13 24,0 t24,0" fill="none" stroke="#176CA4" stroke-width="3"/><path d="M430,192 q12,-13 24,0 t24,0" fill="none" stroke="#28764A" stroke-width="3" stroke-dasharray="4 4" opacity=".45"/><path d="M458,165 q12,-13 24,0 t24,0" fill="none" stroke="#176CA4" stroke-width="3"/><text x="445" y="310" font-size="18" font-weight="bold" text-anchor="middle" fill="#18344A">no recorded signal</text><text x="760" y="100" font-size="18" font-weight="bold" text-anchor="middle" fill="#18344A">NOT DETECTED</text><path d="M690,135 L690,230 Q760,305 830,230 L830,135" fill="#EDF5FA" stroke="#5B6874" stroke-width="3"/><path d="M685,135 L835,135" fill="none" stroke="#5B6874" stroke-width="3"/><path d="M717,165 q12,-13 24,0 t24,0" fill="none" stroke="#176CA4" stroke-width="3"/><path d="M745,192 q12,-13 24,0 t24,0" fill="none" stroke="#28764A" stroke-width="3"/><path d="M773,165 q12,-13 24,0 t24,0" fill="none" stroke="#176CA4" stroke-width="3"/><text x="760" y="310" font-size="18" font-weight="bold" text-anchor="middle" fill="#18344A">no recorded signal</text><text x="450" y="335" font-size="17" font-weight="normal" text-anchor="middle" fill="#18344A">Dashed green target: removed during processing; blue strands are background.</text><text x="450" y="360" font-size="19" font-weight="normal" text-anchor="middle" fill="#18344A">Panels are alternative causes—not three successive steps of one experiment.</text><rect x="35" y="395" width="830" height="130" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="55" y="433" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">Independent-copy toy model</text><text x="55" y="472" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">q = p × survival × detection = 0.1 × 0.5 × 0.8 = 0.04</text><text x="55" y="501" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">P(at least one signal in M copies) = 1 − (1 − q)^M</text><text x="450" y="571" font-size="23" font-weight="bold" text-anchor="middle" fill="#18344A">M = 10: probability ≈ 0.335167</text><text x="450" y="617" font-size="18" font-weight="normal" text-anchor="middle" fill="#18344A">Copy independence and calibrated probabilities are assumptions, not observations.</text></g></svg>
