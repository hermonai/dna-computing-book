<svg xmlns="http://www.w3.org/2000/svg" width="900" height="749" viewBox="0 0 900 749" role="img" aria-labelledby="title desc"><title id="title">DNAD-03-F6: Recovering a witness with decision queries</title><desc id="desc">At most m+1 oracle queries suffice for this search reduction. The oracle is not free and not implemented in polynomial time here.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#176CA4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="450" y="35" font-size="26" font-weight="bold" text-anchor="middle" fill="#18344A">Delete an edge only while a witness survives</text><text x="25" y="83" font-size="22" font-weight="normal" text-anchor="start" fill="#18344A">Query 1: the original six-edge graph is YES.</text><text x="25" y="132" font-size="18" font-weight="bold" text-anchor="start" fill="#18344A">QUERY</text><text x="140" y="132" font-size="18" font-weight="bold" text-anchor="start" fill="#18344A">TRIAL DELETION</text><text x="380" y="132" font-size="18" font-weight="bold" text-anchor="start" fill="#18344A">ORACLE</text><text x="545" y="132" font-size="18" font-weight="bold" text-anchor="start" fill="#18344A">ACTION</text><text x="705" y="132" font-size="18" font-weight="bold" text-anchor="start" fill="#18344A">EDGES LEFT</text><rect x="20" y="157" width="860" height="48" rx="8" fill="#EAF4ED" stroke="#ABC1CF" stroke-width="1.5"/><text x="40" y="188" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">2</text><text x="160" y="188" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">0 → 1</text><text x="395" y="188" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">YES</text><text x="555" y="188" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">DELETE</text><text x="765" y="188" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">5</text><rect x="20" y="214" width="860" height="48" rx="8" fill="#F3F5F7" stroke="#ABC1CF" stroke-width="1.5"/><text x="40" y="245" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">3</text><text x="160" y="245" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">0 → 2</text><text x="395" y="245" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">NO</text><text x="555" y="245" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">RETAIN</text><text x="765" y="245" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">5</text><rect x="20" y="271" width="860" height="48" rx="8" fill="#EAF4ED" stroke="#ABC1CF" stroke-width="1.5"/><text x="40" y="302" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">4</text><text x="160" y="302" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">1 → 2</text><text x="395" y="302" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">YES</text><text x="555" y="302" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">DELETE</text><text x="765" y="302" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">4</text><rect x="20" y="328" width="860" height="48" rx="8" fill="#F3F5F7" stroke="#ABC1CF" stroke-width="1.5"/><text x="40" y="359" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">5</text><text x="160" y="359" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">1 → 3</text><text x="395" y="359" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">NO</text><text x="555" y="359" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">RETAIN</text><text x="765" y="359" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">4</text><rect x="20" y="385" width="860" height="48" rx="8" fill="#F3F5F7" stroke="#ABC1CF" stroke-width="1.5"/><text x="40" y="416" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">6</text><text x="160" y="416" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">2 → 1</text><text x="395" y="416" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">NO</text><text x="555" y="416" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">RETAIN</text><text x="765" y="416" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">4</text><rect x="20" y="442" width="860" height="48" rx="8" fill="#EAF4ED" stroke="#ABC1CF" stroke-width="1.5"/><text x="40" y="473" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">7</text><text x="160" y="473" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">2 → 3</text><text x="395" y="473" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">YES</text><text x="555" y="473" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">DELETE</text><text x="765" y="473" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">3</text><text x="25" y="545" font-size="22" font-weight="bold" text-anchor="start" fill="#18344A">The final graph exposes the witness:</text><circle cx="130" cy="603" r="25" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="130" y="611" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">0</text><path d="M161,603 L313,603" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><circle cx="345" cy="603" r="25" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="345" y="611" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">2</text><path d="M376,603 L528,603" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><circle cx="560" cy="603" r="25" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="560" y="611" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">1</text><path d="M591,603 L743,603" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><circle cx="775" cy="603" r="25" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="775" y="611" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">3</text><text x="450" y="680" font-size="20" font-weight="normal" text-anchor="middle" fill="#18344A">Invariant: the retained graph is YES after every trial, including a NO trial answer.</text><text x="450" y="719" font-size="20" font-weight="normal" text-anchor="middle" fill="#18344A">Seven oracle calls here; each call runs exponential subset search, not a free test.</text></g></svg>
