<svg xmlns="http://www.w3.org/2000/svg" width="900" height="715" viewBox="0 0 900 715" role="img" aria-labelledby="title desc"><title id="title">DNAD-03-F2: Merge prefixes only when the future agrees</title><desc id="desc">Existence of a completion depends on (S,v), not on the order already consumed. This state forgets counts, costs and molecular populations.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#176CA4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="450" y="35" font-size="26" font-weight="bold" text-anchor="middle" fill="#18344A">Different histories; the same remaining search</text><text x="30" y="80" font-size="21" font-weight="bold" text-anchor="start" fill="#18344A">PREFIX A</text><circle cx="65" cy="140" r="25" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="65" y="148" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">0</text><path d="M93,140 L131,140" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><circle cx="160" cy="140" r="25" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="160" y="148" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">1</text><path d="M188,140 L226,140" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><circle cx="255" cy="140" r="25" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="255" y="148" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">2</text><path d="M283,140 L321,140" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><circle cx="350" cy="140" r="25" fill="#E5F2E9" stroke="#176CA4" stroke-width="2.5"/><text x="350" y="148" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">3</text><text x="30" y="200" font-size="20" font-weight="normal" text-anchor="start" fill="#18344A">Used vertices: {0, 1, 2, 3}</text><text x="30" y="270" font-size="21" font-weight="bold" text-anchor="start" fill="#18344A">PREFIX B</text><circle cx="65" cy="330" r="25" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="65" y="338" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">0</text><path d="M93,330 L131,330" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><circle cx="160" cy="330" r="25" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="160" y="338" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">2</text><path d="M188,330 L226,330" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><circle cx="255" cy="330" r="25" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="255" y="338" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">1</text><path d="M283,330 L321,330" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><circle cx="350" cy="330" r="25" fill="#E5F2E9" stroke="#176CA4" stroke-width="2.5"/><text x="350" y="338" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">3</text><text x="30" y="390" font-size="20" font-weight="normal" text-anchor="start" fill="#18344A">Used vertices: {0, 1, 2, 3}</text><path d="M380,140 L485,215" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><path d="M380,330 L485,255" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><rect x="485" y="165" width="395" height="150" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="501" y="200" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">MERGED STATE</text><text x="501" y="240" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">S = {0, 1, 2, 3}</text><text x="501" y="269" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">last vertex = 3</text><text x="501" y="298" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">One Boolean reachability entry</text><path d="M680,315 L680,380" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><circle cx="680" cy="412" r="31" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="680" y="420" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">4</text><text x="680" y="475" font-size="21" font-weight="normal" text-anchor="middle" fill="#18344A">Remaining vertex</text><text x="680" y="510" font-size="19" font-weight="normal" text-anchor="middle" fill="#18344A">Can edge 3 → 4 complete the path?</text><rect x="20" y="550" width="860" height="95" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="35" y="582" font-size="20" font-weight="normal" text-anchor="start" fill="#18344A">What is kept: used set + current endpoint + one witness predecessor.</text><text x="35" y="610" font-size="20" font-weight="normal" text-anchor="start" fill="#18344A">What is forgotten: previous order, alternate-path counts, physical copies.</text><text x="450" y="685" font-size="20" font-weight="normal" text-anchor="middle" fill="#18344A">Illustrative five-vertex instance. Both drawn prefixes use legal directed edges.</text></g></svg>
