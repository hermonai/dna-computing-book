<svg xmlns="http://www.w3.org/2000/svg" width="900" height="757" viewBox="0 0 900 757" role="img" aria-labelledby="title desc"><title id="title">DNAD-03-F8: Factorial enumeration versus subset states</title><desc id="desc">An exponential algorithm can improve on factorial enumeration without becoming polynomial. Operational counters are not wall-clock benchmarks.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#176CA4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="450" y="35" font-size="25" font-weight="bold" text-anchor="middle" fill="#18344A">Count candidates, states and transitions separately</text><text x="450" y="76" font-size="20" font-weight="normal" text-anchor="middle" fill="#18344A">Complete directed graphs; endpoints fixed; early arrival at t forbidden</text><path d="M110,425 L785,425" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><path d="M110,425 L110,115" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><path d="M110,425.0 L765,425.0" fill="none" stroke="#CCD6DF" stroke-width="1"/><text x="95" y="430.0" font-size="17" font-weight="normal" text-anchor="end" fill="#18344A">10^0</text><path d="M110,350.0 L765,350.0" fill="none" stroke="#CCD6DF" stroke-width="1"/><text x="95" y="355.0" font-size="17" font-weight="normal" text-anchor="end" fill="#18344A">10^1</text><path d="M110,275.0 L765,275.0" fill="none" stroke="#CCD6DF" stroke-width="1"/><text x="95" y="280.0" font-size="17" font-weight="normal" text-anchor="end" fill="#18344A">10^2</text><path d="M110,200.0 L765,200.0" fill="none" stroke="#CCD6DF" stroke-width="1"/><text x="95" y="205.0" font-size="17" font-weight="normal" text-anchor="end" fill="#18344A">10^3</text><path d="M110,125.0 L765,125.0" fill="none" stroke="#CCD6DF" stroke-width="1"/><text x="95" y="130.0" font-size="17" font-weight="normal" text-anchor="end" fill="#18344A">10^4</text><text x="110.0" y="453" font-size="19" font-weight="normal" text-anchor="middle" fill="#18344A">2</text><text x="219.16667" y="453" font-size="19" font-weight="normal" text-anchor="middle" fill="#18344A">3</text><text x="328.33333" y="453" font-size="19" font-weight="normal" text-anchor="middle" fill="#18344A">4</text><text x="437.5" y="453" font-size="19" font-weight="normal" text-anchor="middle" fill="#18344A">5</text><text x="546.66667" y="453" font-size="19" font-weight="normal" text-anchor="middle" fill="#18344A">6</text><text x="655.83333" y="453" font-size="19" font-weight="normal" text-anchor="middle" fill="#18344A">7</text><text x="765.0" y="453" font-size="19" font-weight="normal" text-anchor="middle" fill="#18344A">8</text><path d="M110.0,425.0 L219.16667,425.0" fill="none" stroke="#176CA4" stroke-width="2"/><path d="M219.16667,425.0 L328.33333,402.42275" fill="none" stroke="#176CA4" stroke-width="2"/><path d="M328.33333,402.42275 L437.5,366.63866" fill="none" stroke="#176CA4" stroke-width="2"/><path d="M437.5,366.63866 L546.66667,321.48416" fill="none" stroke="#176CA4" stroke-width="2"/><path d="M546.66667,321.48416 L655.83333,269.06141" fill="none" stroke="#176CA4" stroke-width="2"/><path d="M655.83333,269.06141 L765.0,210.70006" fill="none" stroke="#176CA4" stroke-width="2"/><rect x="106.0000" y="421.0000" width="8" height="8" fill="#176CA4"/><rect x="215.1667" y="421.0000" width="8" height="8" fill="#176CA4"/><rect x="324.3333" y="398.4228" width="8" height="8" fill="#176CA4"/><rect x="433.5000" y="362.6387" width="8" height="8" fill="#176CA4"/><rect x="542.6667" y="317.4842" width="8" height="8" fill="#176CA4"/><rect x="651.8333" y="265.0614" width="8" height="8" fill="#176CA4"/><rect x="761.0000" y="206.7001" width="8" height="8" fill="#176CA4"/><rect x="56.0000" y="517.0000" width="8" height="8" fill="#176CA4"/><text x="80" y="528" font-size="21" font-weight="normal" text-anchor="start" fill="#176CA4">all interior orders</text><text x="775" y="528" font-size="21" font-weight="normal" text-anchor="end" fill="#18344A">720</text><path d="M110.0,402.42275 L219.16667,389.21591" fill="none" stroke="#28764A" stroke-width="2"/><path d="M219.16667,389.21591 L328.33333,366.63866" fill="none" stroke="#28764A" stroke-width="2"/><path d="M328.33333,366.63866 L437.5,339.0404" fill="none" stroke="#28764A" stroke-width="2"/><path d="M437.5,339.0404 L546.66667,310.13908" fill="none" stroke="#28764A" stroke-width="2"/><path d="M546.66667,310.13908 L655.83333,281.46396" fill="none" stroke="#28764A" stroke-width="2"/><path d="M655.83333,281.46396 L765.0,253.41487" fill="none" stroke="#28764A" stroke-width="2"/><circle cx="110.0000" cy="402.4228" r="4.5" fill="#28764A"/><circle cx="219.1667" cy="389.2159" r="4.5" fill="#28764A"/><circle cx="328.3333" cy="366.6387" r="4.5" fill="#28764A"/><circle cx="437.5000" cy="339.0404" r="4.5" fill="#28764A"/><circle cx="546.6667" cy="310.1391" r="4.5" fill="#28764A"/><circle cx="655.8333" cy="281.4640" r="4.5" fill="#28764A"/><circle cx="765.0000" cy="253.4149" r="4.5" fill="#28764A"/><circle cx="60.0000" cy="557.0000" r="4.5" fill="#28764A"/><text x="80" y="564" font-size="21" font-weight="normal" text-anchor="start" fill="#28764A">reachable DP states</text><text x="775" y="564" font-size="21" font-weight="normal" text-anchor="end" fill="#18344A">194</text><path d="M110.0,425.0 L219.16667,379.8455" fill="none" stroke="#AD3346" stroke-width="2"/><path d="M219.16667,379.8455 L328.33333,336.79316" fill="none" stroke="#AD3346" stroke-width="2"/><path d="M328.33333,336.79316 L437.5,296.29975" fill="none" stroke="#AD3346" stroke-width="2"/><path d="M437.5,296.29975 L546.66667,258.6887" fill="none" stroke="#AD3346" stroke-width="2"/><path d="M546.66667,258.6887 L655.83333,223.50228" fill="none" stroke="#AD3346" stroke-width="2"/><path d="M655.83333,223.50228 L765.0,190.20085" fill="none" stroke="#AD3346" stroke-width="2"/><rect x="106.0000" y="421.0000" width="8" height="8" fill="#AD3346"/><rect x="215.1667" y="375.8455" width="8" height="8" fill="#AD3346"/><rect x="324.3333" y="332.7932" width="8" height="8" fill="#AD3346"/><rect x="433.5000" y="292.2997" width="8" height="8" fill="#AD3346"/><rect x="542.6667" y="254.6887" width="8" height="8" fill="#AD3346"/><rect x="651.8333" y="219.5023" width="8" height="8" fill="#AD3346"/><rect x="761.0000" y="186.2008" width="8" height="8" fill="#AD3346"/><rect x="56.0000" y="589.0000" width="8" height="8" fill="#AD3346"/><text x="80" y="600" font-size="21" font-weight="normal" text-anchor="start" fill="#AD3346">outgoing-neighbor scans</text><text x="775" y="600" font-size="21" font-weight="normal" text-anchor="end" fill="#18344A">1351</text><text x="450" y="480" font-size="20" font-weight="normal" text-anchor="middle" fill="#18344A">n vertices (vertical axis: logarithmic algorithmic count)</text><text x="775" y="495" font-size="18" font-weight="normal" text-anchor="end" fill="#18344A">at n = 8</text><text x="25" y="658" font-size="20" font-weight="normal" text-anchor="start" fill="#18344A">Enumeration count assumes every interior order is examined, not early stopping.</text><text x="25" y="686" font-size="20" font-weight="normal" text-anchor="start" fill="#18344A">A stored state is not a whole route; a neighbor scan is not a full verification.</text><text x="25" y="714" font-size="20" font-weight="normal" text-anchor="start" fill="#18344A">The plot compares accounting categories, not runtime or molecular efficiency.</text></g></svg>
