<svg xmlns="http://www.w3.org/2000/svg" width="900" height="665" viewBox="0 0 900 665" role="img" aria-labelledby="title desc"><title id="title">DNAD-03-F4: A path as a Boolean assignment</title><desc id="desc">Satisfying assignments and fixed-endpoint paths correspond exactly. Reducing Hamiltonian path to SAT alone does not prove Hamiltonian path hard.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#176CA4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="450" y="35" font-size="24" font-weight="bold" text-anchor="middle" fill="#18344A">x[v,p] = true exactly when vertex v occupies position p</text><text x="330" y="88" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">position p</text><text x="245" y="120" font-size="21" font-weight="normal" text-anchor="middle" fill="#18344A">0</text><text x="345" y="120" font-size="21" font-weight="normal" text-anchor="middle" fill="#18344A">1</text><text x="445" y="120" font-size="21" font-weight="normal" text-anchor="middle" fill="#18344A">2</text><text x="545" y="120" font-size="21" font-weight="normal" text-anchor="middle" fill="#18344A">3</text><text x="130" y="175" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">v = 0</text><rect x="215" y="140" width="65" height="50" rx="8" fill="#E2F2E7" stroke="#ABC1CF" stroke-width="1.5"/><text x="247" y="174" font-size="23" font-weight="normal" text-anchor="middle" fill="#18344A">1</text><rect x="315" y="140" width="65" height="50" rx="8" fill="#F3F5F7" stroke="#ABC1CF" stroke-width="1.5"/><text x="347" y="174" font-size="23" font-weight="normal" text-anchor="middle" fill="#18344A">0</text><rect x="415" y="140" width="65" height="50" rx="8" fill="#F3F5F7" stroke="#ABC1CF" stroke-width="1.5"/><text x="447" y="174" font-size="23" font-weight="normal" text-anchor="middle" fill="#18344A">0</text><rect x="515" y="140" width="65" height="50" rx="8" fill="#F3F5F7" stroke="#ABC1CF" stroke-width="1.5"/><text x="547" y="174" font-size="23" font-weight="normal" text-anchor="middle" fill="#18344A">0</text><text x="130" y="240" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">v = 1</text><rect x="215" y="205" width="65" height="50" rx="8" fill="#F3F5F7" stroke="#ABC1CF" stroke-width="1.5"/><text x="247" y="239" font-size="23" font-weight="normal" text-anchor="middle" fill="#18344A">0</text><rect x="315" y="205" width="65" height="50" rx="8" fill="#E2F2E7" stroke="#ABC1CF" stroke-width="1.5"/><text x="347" y="239" font-size="23" font-weight="normal" text-anchor="middle" fill="#18344A">1</text><rect x="415" y="205" width="65" height="50" rx="8" fill="#F3F5F7" stroke="#ABC1CF" stroke-width="1.5"/><text x="447" y="239" font-size="23" font-weight="normal" text-anchor="middle" fill="#18344A">0</text><rect x="515" y="205" width="65" height="50" rx="8" fill="#F3F5F7" stroke="#ABC1CF" stroke-width="1.5"/><text x="547" y="239" font-size="23" font-weight="normal" text-anchor="middle" fill="#18344A">0</text><text x="130" y="305" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">v = 2</text><rect x="215" y="270" width="65" height="50" rx="8" fill="#F3F5F7" stroke="#ABC1CF" stroke-width="1.5"/><text x="247" y="304" font-size="23" font-weight="normal" text-anchor="middle" fill="#18344A">0</text><rect x="315" y="270" width="65" height="50" rx="8" fill="#F3F5F7" stroke="#ABC1CF" stroke-width="1.5"/><text x="347" y="304" font-size="23" font-weight="normal" text-anchor="middle" fill="#18344A">0</text><rect x="415" y="270" width="65" height="50" rx="8" fill="#E2F2E7" stroke="#ABC1CF" stroke-width="1.5"/><text x="447" y="304" font-size="23" font-weight="normal" text-anchor="middle" fill="#18344A">1</text><rect x="515" y="270" width="65" height="50" rx="8" fill="#F3F5F7" stroke="#ABC1CF" stroke-width="1.5"/><text x="547" y="304" font-size="23" font-weight="normal" text-anchor="middle" fill="#18344A">0</text><text x="130" y="370" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">v = 3</text><rect x="215" y="335" width="65" height="50" rx="8" fill="#F3F5F7" stroke="#ABC1CF" stroke-width="1.5"/><text x="247" y="369" font-size="23" font-weight="normal" text-anchor="middle" fill="#18344A">0</text><rect x="315" y="335" width="65" height="50" rx="8" fill="#F3F5F7" stroke="#ABC1CF" stroke-width="1.5"/><text x="347" y="369" font-size="23" font-weight="normal" text-anchor="middle" fill="#18344A">0</text><rect x="415" y="335" width="65" height="50" rx="8" fill="#F3F5F7" stroke="#ABC1CF" stroke-width="1.5"/><text x="447" y="369" font-size="23" font-weight="normal" text-anchor="middle" fill="#18344A">0</text><rect x="515" y="335" width="65" height="50" rx="8" fill="#E2F2E7" stroke="#ABC1CF" stroke-width="1.5"/><text x="547" y="369" font-size="23" font-weight="normal" text-anchor="middle" fill="#18344A">1</text><text x="650" y="190" font-size="22" font-weight="normal" text-anchor="start" fill="#18344A">Example order</text><text x="650" y="220" font-size="22" font-weight="normal" text-anchor="start" fill="#18344A">0 → 1 → 2 → 3</text><rect x="20" y="435" width="410" height="145" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="36" y="470" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">ASSIGNMENT CONSTRAINTS</text><text x="36" y="510" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">Exactly one true value per row.</text><text x="36" y="539" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">Exactly one true value per column.</text><text x="36" y="568" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">Pin the start and finish positions.</text><rect x="460" y="435" width="420" height="145" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="476" y="470" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">TRANSITION CONSTRAINTS</text><text x="476" y="510" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">For every forbidden edge u → v:</text><text x="476" y="539" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">¬x[u,p] ∨ ¬x[v,p+1]</text><text x="476" y="568" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">for each consecutive position pair.</text><text x="450" y="630" font-size="21" font-weight="normal" text-anchor="middle" fill="#18344A">Toy instance: 16 variables; 88 clauses; 190 literal occurrences.</text></g></svg>
