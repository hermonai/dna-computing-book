<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title desc"><title id="title">DNAD-03-F9: Small depth can hide large work</title><desc id="desc">Parallel depth is only one resource coordinate. Do not equate Boolean circuit depth to laboratory time.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#176CA4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="450" y="35" font-size="25" font-weight="bold" text-anchor="middle" fill="#18344A">Four candidate histories; three sequential tests each</text><text x="450" y="75" font-size="19" font-weight="normal" text-anchor="middle" fill="#18344A">Toy work/depth model: one test is one abstract unit, not one second.</text><text x="40" y="154" font-size="20" font-weight="normal" text-anchor="start" fill="#18344A">copy 1</text><circle cx="225" cy="145" r="28" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="225" y="153" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">1</text><path d="M280,145 L414,145" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><circle cx="450" cy="145" r="28" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="450" y="153" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">2</text><path d="M505,145 L639,145" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><circle cx="675" cy="145" r="28" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="675" y="153" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">3</text><text x="800" y="153" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">result</text><text x="40" y="241" font-size="20" font-weight="normal" text-anchor="start" fill="#18344A">copy 2</text><circle cx="225" cy="232" r="28" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="225" y="240" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">1</text><path d="M280,232 L414,232" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><circle cx="450" cy="232" r="28" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="450" y="240" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">2</text><path d="M505,232 L639,232" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><circle cx="675" cy="232" r="28" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="675" y="240" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">3</text><text x="800" y="240" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">result</text><text x="40" y="328" font-size="20" font-weight="normal" text-anchor="start" fill="#18344A">copy 3</text><circle cx="225" cy="319" r="28" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="225" y="327" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">1</text><path d="M280,319 L414,319" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><circle cx="450" cy="319" r="28" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="450" y="327" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">2</text><path d="M505,319 L639,319" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><circle cx="675" cy="319" r="28" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="675" y="327" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">3</text><text x="800" y="327" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">result</text><text x="40" y="415" font-size="20" font-weight="normal" text-anchor="start" fill="#18344A">copy 4</text><circle cx="225" cy="406" r="28" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="225" y="414" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">1</text><path d="M280,406 L414,406" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><circle cx="450" cy="406" r="28" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="450" y="414" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">2</text><path d="M505,406 L639,406" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><circle cx="675" cy="406" r="28" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="675" y="414" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">3</text><text x="800" y="414" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">result</text><path d="M195,490 L705,490" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><text x="450" y="535" font-size="23" font-weight="bold" text-anchor="middle" fill="#18344A">Critical-path depth = 3     Total work = 4 × 3 = 12</text><text x="450" y="583" font-size="19" font-weight="normal" text-anchor="middle" fill="#18344A">Parallel execution needs simultaneous capacity; serial reuse needs more time.</text></g></svg>
