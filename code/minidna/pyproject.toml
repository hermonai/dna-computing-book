[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "minidna"
version = "0.1.0"
description = "Transparent DNA sequence and computation examples for the companion book"
requires-python = ">=3.11"
dependencies = ["torch>=2.2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["minidna*"]

