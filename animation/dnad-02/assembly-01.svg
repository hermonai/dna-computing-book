<svg xmlns="http://www.w3.org/2000/svg" width="900" height="237" viewBox="0 0 900 237" role="img" aria-labelledby="title desc"><title id="title">DNAD-02-F4-K1: Association is not a backbone bond</title><desc id="desc">Separated fragments; aligned duplex with nick; continuous ligated upper backbone Static state-changing keyframe, not a rendered animation or measured trajectory.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#176CA4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="20" y="45" font-size="22" font-weight="bold" text-anchor="start" fill="#18344A">1  Separate</text><rect x="75" y="70" width="110" height="45" rx="8" fill="#FFFFFF" stroke="#176CA4" stroke-width="1.5"/><text x="130" y="100" font-size="22" font-weight="bold" text-anchor="middle" fill="#18344A">R2</text><rect x="200" y="70" width="110" height="45" rx="8" fill="#FFFFFF" stroke="#176CA4" stroke-width="1.5"/><text x="255" y="100" font-size="22" font-weight="bold" text-anchor="middle" fill="#18344A">L3</text><rect x="390" y="70" width="110" height="45" rx="8" fill="#FFFFFF" stroke="#176CA4" stroke-width="1.5"/><text x="445" y="100" font-size="22" font-weight="bold" text-anchor="middle" fill="#18344A">R3</text><rect x="515" y="70" width="110" height="45" rx="8" fill="#FFFFFF" stroke="#176CA4" stroke-width="1.5"/><text x="570" y="100" font-size="22" font-weight="bold" text-anchor="middle" fill="#18344A">L4</text><path d="M185,92 L200,92" fill="none" stroke="#176CA4" stroke-width="3"/><path d="M500,92 L515,92" fill="none" stroke="#176CA4" stroke-width="3"/><text x="30" y="101" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">5′</text><text x="640" y="101" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">3′</text><text x="695" y="99" font-size="20" font-weight="normal" text-anchor="start" fill="#28764A">free splin