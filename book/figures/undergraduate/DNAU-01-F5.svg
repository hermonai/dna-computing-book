<svg xmlns="http://www.w3.org/2000/svg" width="900" height="375" viewBox="0 0 900 375" role="img" aria-labelledby="title desc">
<title id="title">DNAU-01-F5: What would make a physical change a computation?</title>
<desc id="desc">A physical event becomes an answer to a problem through a stated representation and operation. This is a design checklist, not a demonstrated reaction, laboratory protocol or speed claim.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176CA4"/></marker></defs>
<rect width="900" height="375" fill="white"/>
<g font-family="DejaVu Sans, sans-serif"><rect x="10" y="15" width="280" height="300" rx="10" fill="#EDF5FA" stroke="#9DB6C7" stroke-width="1.5"/><text x="150" y="52" font-size="22" font-weight="bold" text-anchor="middle" fill="#172F43">WRITE INPUT</text><text x="150" y="87" font-size="20" font-weight="normal" text-anchor="middle" fill="#172F43">What represents the start?</text><text x="30" y="147" font-size="21" font-weight="bold" text-anchor="start" fill="#172F43">Three in the tray</text><text x="30" y="217" font-size="21" font-weight="normal" text-anchor="start" fill="#172F43">Choose a DNA</text><text x="30" y="246" font-size="21" font-weight="normal" text-anchor="start" fill="#172F43">representation</text><rect x="310" y="15" width="280" height="300" rx="10" fill="#EDF5FA" stroke="#9DB6C7" stroke-width="1.5"/><text x="450" y="52" font-size="22" font-weight="bold" text-anchor="middle" fill="#172F43">PERFORM RULE</text><text x="450" y="87" font-size="20" font-weight="normal" text-anchor="middle" fill="#172F43">Which change is allowed?</text><text x="330" y="147" font-size="21" font-weight="bold" text-anchor="start" fill="#172F43">Move two into the tray</text><text x="330" y="217" font-size="21" font-weight="normal" text-anchor="start" fill="#172F43">Specify a controlled</text><text x="330" y="246" font-size="21" font-weight="normal" text-anchor="start" fill="#172F43">molecular operation</text><rect x="610" y="15" width="280" height="300" rx="10" fill="#EDF5FA" stroke="#9DB6C7" stroke-width="1.5"/><text x="750" y="52" font-size="22" font-weight="bold" text-anchor="middle" fill="#172F43">READ OUTPUT</text><text x="750" y="87" font-size="20" font-weight="normal" text-anchor="middle" fill="#172F43">What counts as an answer?</text><text x="630" y="147" font-size="21" font-weight="bold" text-anchor="start" fill="#172F43">Count five</text><text x="630" y="217" font-size="21" font-weight="normal" text-anchor="start" fill="#172F43">Measure and interpret</text><text x="630" y="246" font-size="21" font-weight="normal" text-anchor="start" fill="#172F43">the resulting material</text><text x="450" y="352" font-size="21" font-weight="normal" text-anchor="middle" fill="#172F43">Top example: counters. Bottom lane: questions for a DNA design.</text></g></svg>
