<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="880" viewBox="0 0 1000 880" role="img" aria-labelledby="title desc">
<title id="title">DNA-G06: Paired strands keep opposite directions</title>
<desc id="desc">Canonical sequence model; foundational structure reviewed against Cooper 2000 and Alberts et al. 2002. Solid backbone: covalent connectivity; dashed contacts: canonical pairing; transition arrow: rewrite the same strand. The upper panel preserves pairing columns. The lower panel rewrites only the partner; it does not create a new molecule. Writing TTGC as 5′ to 3′ and treating it as the aligned partner loses polarity. Compatibility alone does not predict binding.</desc>
