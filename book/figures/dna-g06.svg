<text x="30" y="78" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="bold" text-anchor="start" fill="#19324a">Paired strands keep opposite directions</text>
<text x="30" y="111" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#19324a">Base substitution and a change of written orientation are different operations</text>
