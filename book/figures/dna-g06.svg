<text x="45" y="682" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#19324a">Same partner, different written order. No synthesis or chemical reversal is shown.</text>
<text x="30" y="753" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#19324a">READING: The upper panel preserves pairing columns. The lower panel rewrites only the partner;</text>
<text x="30" y="775" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#19324a">it does not create a new molecule.</text>
<text x="30" y="814" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#19324a">BOUNDARY: Writing TTGC as 5′ to 3′ and treating it as the aligned partner loses polarity.</text>
<text x="30" y="836" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#19324a">Compatibility alone does not predict binding.</text>
