<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="920" viewBox="0 0 1000 920" role="img" aria-labelledby="title desc">
<title id="title">DNA-G04: Learning path: mechanism before generalization</title>
<desc id="desc">Editorial model; arrows specify relationships, not measured superiority. Exercises alternate physical explanation, formal derivation and code so none substitutes for the others. Failure: Stop a derivation when it relies on a mechanism or mathematical prerequisite not yet introduced.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#245579"/></marker></defs>
<rect width="1000" height="920" fill="white"/>
<text x="30" y="36" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#245579" font-weight="bold" text-anchor="start">DNA-G04  /  EDITION 2 RESEARCH MAP</text>
<text x="30" y="77" font-family="DejaVu Sans, sans-serif" font-size="28" fill="#20334a" font-weight="bold" text-anchor="start">Learning path: mechanism before generalization</text>
<text x="30" y="110" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#20334a" font-weight="normal" text-anchor="start">The next layer uses concepts already made concrete</text>
<path d="M215,270 V340" fill="none" stroke="#245579" stroke-width="2" marker-end="url(#arrow)"/>
<text x="232" y="306" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#20334a" font-weight="normal" text-anchor="start">prerequisite</text>
<path d="M215,455 V525" fill="none" stroke="#245579" stroke-width="2" marker-end="url(#arrow)"/>
<text x="232" y="491" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#20334a" font-weight="normal" text-anchor="start">generalize</text>
<path d="M400,213 H600" fill="none" stroke="#245579" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="500" y="180" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#20334a" font-weight="normal" text-anchor="middle">illustrate</text>
<path d="M400,398 H600" fill="none" stroke="#245579" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="500" y="365" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#20334a" font-weight="normal" text-anchor="middle">implement</text>
<path d="M400,583 H600" fill="none" stroke="#245579" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="500" y="550" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#20334a" font-weight="normal" text-anchor="middle">evaluate</text>
<path d="M785,270 V340" fill="none" stroke="#245579" stroke-width="2" marker-end="url(#arrow)"/>
<text x="802" y="306" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#20334a" font-weight="normal" text-anchor="start">abstract cautiously</text>
<path d="M785,455 V525" fill="none" stroke="#245579" stroke-width="2" marker-end="url(#arrow)"/>
<text x="802" y="491" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#20334a" font-weight="normal" text-anchor="start">compare</text>
<rect x="30" y="155" width="370" height="115" rx="9" fill="#eef5fb" stroke="#afc4d5"/>
<text x="45" y="183" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#20334a" font-weight="bold" text-anchor="start">Molecular foundations</text>
<text x="45" y="210" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#20334a" font-weight="normal" text-anchor="start">Composition, polarity, pairing and</text>
<text x="45" y="232" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#20334a" font-weight="normal" text-anchor="start">environment.</text>
<rect x="30" y="340" width="370" height="115" rx="9" fill="#eef5fb" stroke="#afc4d5"/>
<text x="45" y="368" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#20334a" font-weight="bold" text-anchor="start">Operations and algorithms</text>
<text x="45" y="395" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#20334a" font-weight="normal" text-anchor="start">Generate, transform, filter and read</text>
<text x="45" y="417" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#20334a" font-weight="normal" text-anchor="start">molecular data.</text>
<rect x="30" y="525" width="370" height="115" rx="9" fill="#eef5fb" stroke="#afc4d5"/>
<text x="45" y="553" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#20334a" font-weight="bold" text-anchor="start">Models and limits</text>
<text x="45" y="580" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#20334a" font-weight="normal" text-anchor="start">CRNs, rewriting, assembly and cost</text>
<text x="45" y="602" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#20334a" font-weight="normal" text-anchor="start">accounting.</text>
<rect x="600" y="155" width="370" height="115" rx="9" fill="#f2f7f2" stroke="#afc4d5"/>
<text x="615" y="183" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#20334a" font-weight="bold" text-anchor="start">Worked physical example</text>
<text x="615" y="210" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#20334a" font-weight="normal" text-anchor="start">Explain one observed process without</text>
<text x="615" y="232" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#20334a" font-weight="normal" text-anchor="start">hidden chemistry.</text>
<rect x="600" y="340" width="370" height="115" rx="9" fill="#f2f7f2" stroke="#afc4d5"/>
<text x="615" y="368" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#20334a" font-weight="bold" text-anchor="start">Executable abstraction</text>
<text x="615" y="395" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#20334a" font-weight="normal" text-anchor="start">Run a small model and expose what it</text>
<text x="615" y="417" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#20334a" font-weight="normal" text-anchor="start">omits.</text>
<rect x="600" y="525" width="370" height="115" rx="9" fill="#f2f7f2" stroke="#afc4d5"/>
<text x="615" y="553" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#20334a" font-weight="bold" text-anchor="start">Frontier judgment</text>
<text x="615" y="580" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#20334a" font-weight="normal" text-anchor="start">Separate demonstrated systems from</text>
<text x="615" y="602" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#20334a" font-weight="normal" text-anchor="start">research directions.</text>
<text x="30" y="744" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#245579" font-weight="bold" text-anchor="start">Solid: data / dependency     Dashed: control / review</text>
<text x="30" y="772" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#20334a" font-weight="normal" text-anchor="start">READING: Exercises alternate physical explanation, formal derivation and code so none substitutes for</text>
<text x="30" y="795" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#20334a" font-weight="normal" text-anchor="start">the others.</text>
<text x="30" y="818" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#20334a" font-weight="normal" text-anchor="start">BOUNDARY: Stop a derivation when it relies on a mechanism or mathematical prerequisite not yet</text>
<text x="30" y="841" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#20334a" font-weight="normal" text-anchor="start">introduced.</text>
<text x="30" y="898" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#20334a" font-weight="normal" text-anchor="start">Conceptual map. No measured superiority or physical validation is implied by an arrow.</text>
</svg>
