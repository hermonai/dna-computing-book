<svg xmlns="http://www.w3.org/2000/svg" width="900" height="412" viewBox="0 0 900 412" role="img" aria-labelledby="title desc"><title id="title">DNAD-02-F14: Several mechanisms grew beyond generate-and-filter</title><desc id="desc">What changes in the next research traditions? A conceptual map is not proof that one paper caused every branch.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#176CA4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="22" y="32" font-size="20" font-weight="bold" text-anchor="start" fill="#18344A">Tradition</text><text x="252" y="32" font-size="20" font-weight="bold" text-anchor="start" fill="#18344A">State / operation</text><text x="592" y="32" font-size="20" font-weight="bold" text-anchor="start" fill="#18344A">Question opened</text><rect x="10" y="50" width="880" height="65" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="22" y="79" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">SAT filtering</text><text x="252" y="79" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">assignments / selection</text><text x="592" y="79" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">which clauses hold?</text><rect x="10" y="120" width="880" height="65" rx="8" fill="#FFFFFF" stroke="#ABC1CF" stroke-width="1.5"/><text x="22" y="149" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">Formal DNA systems</text><text x="252" y="149" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">strings / formal operators</text><text x="592" y="149" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">what can be computed?</text><rect x="10" y="190" width="880" height="65" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="22" y="219" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">Molecular automata</text><text x="252" y="219" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">state + input / transitions</text><text x="592" y="219" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">can reactions follow rules?</text><rect x="10" y="260" width="880" height="65" rx="8" fill="#FFFFFF" stroke="#ABC1CF" stroke-width="1.5"/><text x="22" y="289" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">Self-assembly</text><text x="252" y="289" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">tiles / local attachment</text><text x="592" y="289" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">can shape encode a program?</text><rect x="10" y="330" width="880" height="65" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="22" y="359" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">Strand displacement</text><text x="252" y="359" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">signals / strand exchange</text><text x="592" y="359" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">can chemistry compose gates?</text></g></svg>
