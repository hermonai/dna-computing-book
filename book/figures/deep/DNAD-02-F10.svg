<svg xmlns="http://www.w3.org/2000/svg" width="900" height="397" viewBox="0 0 900 397" role="img" aria-labelledby="title desc"><title id="title">DNAD-02-F10: One computation, three representations</title><desc id="desc">How do algorithm, molecules and operations correspond? Avoid asserting one procedure is an exact molecular Boolean gate.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#176CA4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="22" y="32" font-size="20" font-weight="bold" text-anchor="start" fill="#18344A">Logical condition</text><text x="287" y="32" font-size="20" font-weight="bold" text-anchor="start" fill="#18344A">Molecular property</text><text x="577" y="32" font-size="20" font-weight="bold" text-anchor="start" fill="#18344A">Laboratory operation</text><rect x="10" y="50" width="880" height="62" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="22" y="79" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">permitted adjacency</text><text x="287" y="79" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">oriented code overlap</text><text x="577" y="79" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">anneal + ligate</text><rect x="10" y="117" width="880" height="62" rx="8" fill="#FFFFFF" stroke="#ABC1CF" stroke-width="1.5"/><text x="22" y="146" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">correct endpoints</text><text x="287" y="146" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">opposed primer sites</text><text x="577" y="146" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">PCR enrichment</text><rect x="10" y="184" width="880" height="62" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="22" y="213" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">seven occurrences</text><text x="287" y="213" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">140-bp product</text><text x="577" y="213" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">gel fraction recovery</text><rect x="10" y="251" width="880" height="62" rx="8" fill="#FFFFFF" stroke="#ABC1CF" stroke-width="1.5"/><text x="22" y="280" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">contains vertex i</text><text x="287" y="280" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">probe-complement site</text><text x="577" y="280" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">affinity selection</text><rect x="10" y="318" width="880" height="62" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="22" y="347" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">valid witness</text><text x="287" y="347" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">resolved ordered code</text><text x="577" y="347" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">decode + graph check</text></g></svg>
