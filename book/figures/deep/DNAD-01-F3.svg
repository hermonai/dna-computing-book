<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc"><title id="title">DNAD-01-F3: Why plausible routes fail</title><desc id="desc">Compare valid, repeated, missing and illegal-edge candidates with exact rejection reasons. A length-and-coverage check cannot establish adjacency.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#176CA4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><rect x="10" y="15" width="880" height="90" rx="8" fill="#F0F8F2" stroke="#ABC1CF" stroke-width="1.5"/><text x="28" y="43" font-size="20" font-weight="bold" text-anchor="start" fill="#18344A">VALID</text><circle cx="290" cy="35" r="24" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="290" y="43" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">A</text><path d="M316,35 L330,35" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><circle cx="358" cy="35" r="24" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="358" y="43" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">B</text><path d="M384,35 L398,35" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><circle cx="426" cy="35" r="24" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="426" y="43" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">C</text><path d="M452,35 L466,35" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><circle cx="494" cy="35" r="24" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="494" y="43" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">D</text><path d="M520,35 L534,35" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><circle cx="562" cy="35" r="24" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="562" y="43" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">E</text><path d="M588,35 L602,35" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><circle cx="630" cy="35" r="24" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="630" y="43" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">F</text><text x="285" y="87" font-size="20" font-weight="normal" text-anchor="start" fill="#5B6874">all six, legal edges</text><rect x="10" y="115" width="880" height="90" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="28" y="143" font-size="20" font-weight="bold" text-anchor="start" fill="#18344A">REPEAT</text><circle cx="290" cy="135" r="24" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="290" y="143" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">A</text><path d="M316,135 L330,135" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><circle cx="358" cy="135" r="24" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="358" y="143" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">B</text><path d="M384,135 L398,135" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><circle cx="426" cy="135" r="24" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="426" y="143" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">C</text><path d="M452,135 L466,135" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><circle cx="494" cy="135" r="24" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="494" y="143" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">B</text><path d="M520,135 L534,135" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><circle cx="562" cy="135" r="24" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="562" y="143" font-size="24" font-weight="bold" text-