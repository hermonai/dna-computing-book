<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="title desc"><title id="title">DNAD-01-F8: A length profile is not automatically one route</title><desc id="desc">Draw schematic graduated-primer lanes for a known teaching route and explain mixture ambiguity. Synthetic expected bands, not experimental data or a copied gel.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#176CA4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="450" y="29" font-size="23" font-weight="bold" text-anchor="middle" fill="#18344A">Synthetic expected bands for the teaching witness A B C D E F</text><rect x="110" y="65" width="680" height="320" rx="8" fill="#F2F6F8" stroke="#ABC1CF" stroke-width="1.5"/><rect x="177" y="75" width="46" height="15" rx="8" fill="#DCE7EF" stroke="#ABC1CF" stroke-width="1.5"/><text x="200" y="56" font-size="22" font-weight="bold" text-anchor="middle" fill="#18344A">B</text><rect x="168" y="360.0" width="64" height="8" fill="#176CA4"/><rect x="297" y="75" width="46" height="15" rx="8" fill="#DCE7EF" stroke="#ABC1CF" stroke-width="1.5"/><text x="320" y="56" font-size="22" font-weight="bold" text-anchor="middle" fill="#18344A">C</text><rect x="288" y="310.0" width="64" height="8" fill="#176CA4"/><rect x="417" y="75" width="46" height="15" rx="8" fill="#DCE7EF" stroke="#ABC1CF" stroke-width="1.5"/><text x="440" y="56" font-size="22" font-weight="bold" text-anchor="middle" fill="#18344A">D</text><rect x="408" y="260.0" width="64" height="8" fill="#176CA4"/><rect x="537" y="75" width="46" height="15" rx="8" fill="#DCE7EF" stroke="#ABC1CF" stroke-width="1.5"/><text x="560" y="56" font-size="22" font-weight="bold" text-anchor="middle" fill="#18344A">E</text><rect x="528" y="210.0" width="64" height="8" fill="#176CA4"/><rect x="657" y="75" width="46" height="15" rx="8" fill="#DCE7EF" stroke="#ABC1CF" stroke-width="1.5"/><text x="680" y="56" font-size="22" font-weight="bold" text-anchor="middle" fill="#18344A">F</text><rect x="648" y="160.0" width="64" height="8" fill="#176CA4"/><text x="93" y="369.0" font-size="19" font-weight="normal" text-anchor="end" fill="#18344A">40</text><text x="93" y="319.0" font-size="19" font-weight="normal" text-anchor="end" fill="#18344A">60</text><text x="93" y="269.0" font-size="19" font-weight="normal" text-anchor="end" fill="#18344A">80</text><text x="93" y="219.0" font-size="19" font-weight="normal" text-anchor="end" fill="#18344A">100</text><text x="93" y="169.0" font-size="19" font-weight="normal" text-anchor="end" fill="#18344A">120</text><text x="52" y="245" font-size="20" font-weight="bold" text-anchor="start" fill="#18344A">bp</text><text x="450" y="424" font-size="21" font-weight="normal" text-anchor="middle" fill="#18344A">Assume 20 bases per vertex in this idealized length model.</text><text x="450" y="457" font-size="21" font-weight="normal" text-anchor="middle" fill="#AD3346">A mixture can superpose bands from different molecules.</text></g></svg>
