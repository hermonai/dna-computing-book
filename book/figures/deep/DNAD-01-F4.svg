oke-dasharray="8 6"/><path d="M578,155 L578,255" fill="none" stroke="#28764A" stroke-width="1.5" stroke-dasharray="8 6"/><path d="M600,155 L600,255" fill="none" stroke="#28764A" stroke-width="1.5" stroke-dasharray="8 6"/><text x="238" y="306" font-size="24" font-weight="normal" text-anchor="start" fill="#18344A">3′</text><text x="636" y="306" font-size="24" font-weight="normal" text-anchor="start" fill="#18344A">5′</text><text x="450" y="367" font-size="22" font-weight="normal" text-anchor="middle" fill="#18344A">B splint: antiparallel pairing aligns the adjacent ends.</text><text x="450" y="402" font-size="20" font-weight="normal" text-anchor="middle" fill="#18344A">Dashed vertical marks: pairing. Closing the nick makes a backbone bond.</text></g></svg>
