<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc"><title id="title">DNAD-01-F4: A vertex splint aligns two directed edges</title><desc id="desc">Draw 5′/3′ edge strands, adjacent domains and an antiparallel splint beneath the nick. Symbolic domains, not designed experimental oligos; pairing and covalent joining use distinct marks.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#176CA4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="450" y="32" font-size="25" font-weight="bold" text-anchor="middle" fill="#18344A">Two edge fragments meet at vertex B</text><rect x="115" y="85" width="145" height="63" rx="8" fill="#EFF5FA" stroke="#176CA4" stroke-width="1.5"/><text x="187" y="127" font-size="26" font-weight="bold" text-anchor="middle" fill="#176CA4">a_R</text><rect x="290" y="85" width="145" height="63" rx="8" fill="#EFF5FA" stroke="#28764A" stroke-width="1.5"/><text x="362" y="127" font-size="26" font-weight="bold" text-anchor="middle" fill="#28764A">b_L</text><rect x="475" y="85" width="145" height="63" rx="8" fill="#EFF5FA" stroke="#28764A" stroke-width="1.5"/><text x="547" y="127" font-size="26" font-weight="bold" text-anchor="middle" fill="#28764A">b_R</text><rect x="650" y="85" width="145" height="63" rx="8" fill="#EFF5FA" stroke="#7147A8" stroke-width="1.5"/><text x="722" y="127" font-size="26" font-weight="bold" text-anchor="middle" fill="#7147A8">c_L</text><path d="M93,116 L110,116" fill="none" stroke="#176CA4" stroke-width="3"/><text x="35" y="122" font-size="24" font-weight="normal" text-anchor="start" fill="#18344A">5′</text><path d="M799,116 L825,116" fill="none" stroke="#176CA4" stroke-width="3"/><text x="838" y="122" font-size="24" font-weight="normal" text-anchor="start" fill="#18344A">3′</text><path d="M260,116 L290,116" fill="none