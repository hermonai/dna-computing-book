<svg xmlns="http://www.w3.org/2000/svg" width="900" height="486" viewBox="0 0 900 486" role="img" aria-labelledby="title desc"><title id="title">DNAD-02-F13: Count materials before celebrating parallelism</title><desc id="desc">Which budget grows, and under what assumption? No universal factorial lower bound for DNA computation.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#176CA4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><rect x="10" y="10" width="880" height="115" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="26" y="45" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">Historical input inventory</text><text x="26" y="85" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">50 pmol/species → about 3.01 × 10¹³ oligos/species</text><text x="26" y="114" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">14 edge species + 5 internal splints; not 19 completed routes</text><g transform="translate(0 145)"><text x="22" y="32" font-size="20" font-weight="bold" text-anchor="start" fill="#18344A">Vertices n</text><text x="192" y="32" font-size="20" font-weight="bold" text-anchor="start" fill="#18344A">Fixed-endpoint orders</text><text x="552" y="32" font-size="20" font-weight="bold" text-anchor="start" fill="#18344A">Assumption</text><rect x="10" y="50" width="880" height="52" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="22" y="79" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">7</text><text x="192" y="79" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">120</text><text x="552" y="79" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">complete directed graph</text><rect x="10" y="107" width="880" height="52" rx="8" fill="#FFFFFF" stroke="#ABC1CF" stroke-width="1.5"/><text x="22" y="136" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">10</text><text x="192" y="136" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">40,320</text><text x="552" y="136" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">complete directed graph</text><rect x="10" y="164" width="880" height="52" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="22" y="193" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">15</text><text x="192" y="193" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">6,227,020,800</text><text x="552" y="193" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">complete directed graph</text><rect x="10" y="221" width="880" height="52" rx="8" fill="#FFFFFF" stroke="#ABC1CF" stroke-width="1.5"/><text x="22" y="250" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">20</text><text x="192" y="250" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">6,402,373,705,728,000</text><text x="552" y="250" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">complete directed graph</text></g><text x="450" y="465" font-size="19" font-weight="normal" text-anchor="middle" fill="#5B6874">Search-space count ≠ sampled route support ≠ measured reagent concentration.</text></g></svg>
