<svg xmlns="http://www.w3.org/2000/svg" width="900" height="479" viewBox="0 0 900 479" role="img" aria-labelledby="title desc"><title id="title">DNAD-01-F6: From graph to a checked witness</title><desc id="desc">Nine stage panels grouped as design, chemistry and evidence; each panel is labeled by its role. A panel need not equal one physical laboratory operation.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#176CA4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><rect x="10.0" y="15" width="279.3333333333333" height="116" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="26.0" y="50" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">1  Graph</text><text x="26.0" y="90" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">constraints</text><path d="M290.33333,73.0 L300.33333,73.0" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><rect x="303.3333333333333" y="15" width="279.3333333333333" height="116" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="319.33333" y="50" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">2  Codes</text><text x="319.33333" y="90" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">vertex identity</text><path d="M583.66667,73.0 L593.66667,73.0" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><rect x="596.6666666666666" y="15" width="279.3333333333333" height="116" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="612.66667" y="50" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">3  Edges</text><text x="612.66667" y="90" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">oriented overlaps</text><rect x="10.0" y="156" width="279.3333333333333" height="116" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="26.0" y="191" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">4  Mix</text><text x="26.0" y="231" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">physical preparation</text><path d="M290.33333,214.0 L300.33333,214.0" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><rect x="303.3333333333333" y="156" width="279.3333333333333" height="116" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="319.33333" y="191" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">5  Candidates</text><text x="319.33333" y="231" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">possible assemblies</text><path d="M583.66667,214.0 L593.66667,214.0" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><rect x="596.6666666666666" y="156" width="279.3333333333333" height="116" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="612.66667" y="191" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">6  Endpoints</text><text x="612.66667" y="231" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">PCR enrichment</text><rect x="10.0" y="297" width="279.3333333333333" height="116" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="26.0" y="332" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">7  Length</text><text x="26.0" y="372" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">size selection</text><path d="M290.33333,355.0 L300.33333,355.0" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><rect x="303.3333333333333" y="297" width="279.3333333333333" height="116" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="319.33333" y="332" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">8  Vertices</text><text x="319.33333" y="372" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">affinity retention</text><path d="M583.66667,355.0 L593.66667,355.0" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><rect x="596.6666666666666" y="297" width="279.3333333333333" height="116" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="612.66667" y="332" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">9  Read + check</text><text x="612.66667" y="372" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">decode; verify graph</text><text x="450" y="455" font-size="20" font-weight="normal" text-anchor="middle" fill="#18344A">Design → chemistry → evidence. Panels are conceptual stages, not a lab protocol.</text></g></svg>
