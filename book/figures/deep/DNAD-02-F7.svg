<svg xmlns="http://www.w3.org/2000/svg" width="900" height="451" viewBox="0 0 900 451" role="img" aria-labelledby="title desc"><title id="title">DNAD-02-F7: Length selects occurrences, not identities</title><desc id="desc">What does the 140-bp fraction establish? Synthetic bands are not photographs or quantitative mobility predictions.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#176CA4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><rect x="25" y="35" width="280" height="355" rx="8" fill="#F1F5F8" stroke="#ABC1CF" stroke-width="1.5"/><text x="165" y="24" font-size="22" font-weight="bold" text-anchor="middle" fill="#18344A">Synthetic size lane</text><path d="M75,130 L210,130" fill="none" stroke="#176CA4" stroke-width="7"/><text x="230" y="137" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">160</text><path d="M75,210 L210,210" fill="none" stroke="#28764A" stroke-width="7"/><text x="230" y="217" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">140</text><path d="M75,290 L210,290" fill="none" stroke="#176CA4" stroke-width="7"/><text x="230" y="297" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">120</text><path d="M45,70 L45,340" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><text x="105" y="370" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">migration</text><rect x="340" y="60" width="535" height="125" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="356" y="95" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">140 bp: seven code occurrences</text><text x="356" y="135" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">0 1 2 3 4 5 6     all distinct</text><text x="356" y="164" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">0 3 2 3 4 5 6     3 repeats</text><rect x="340" y="215" width="535" height="145" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="356" y="250" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">Same size ≠ same identity</text><text x="356" y="290" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">20 bases/code × 7 codes = 140 bases</text><text x="356" y="319" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">Duplex products: 140 bp</text><text x="356" y="348" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">Coverage must be checked separately</text><text x="450" y="430" font-size="19" font-weight="normal" text-anchor="middle" fill="#5B6874">Band spacing is conceptual, not calibrated gel mobility or measured intensity.</text></g></svg>
