<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="920" viewBox="0 0 1000 920" role="img" aria-labelledby="title desc">
<title id="title">DNA-G03: From molecule to a defensible computation</title>
<desc id="desc">Editorial model; arrows specify relationships, not measured superiority. Unexpected products feed back into the construction and abstraction; preserve the failed record. Failure: An attractive simulation without physical controls is not an experimental demonstration.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#245579"/></marker></defs>
<rect width="1000" height="920" fill="white"/>
<text x="30" y="36" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#245579" font-weight="bold" text-anchor="start">DNA-G03  /  EDITION 2 RESEARCH MAP</text>
<text x="30" y="77" font-family="DejaVu Sans, sans-serif" font-size="28" fill="#20334a" font-weight="bold" text-anchor="start">From molecule to a defensible computation</text>
<text x="30" y="110" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#20334a" font-weight="normal" text-anchor="start">A result needs an encoding and a measurement contract</text>
<path d="M215,270 V340" fill="none" stroke="#245579" stroke-width="2" marker-end="url(#arrow)"/>
<text x="232" y="306" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#20334a" font-weight="normal" text-anchor="start">encode</text>
<path d="M215,455 V525" fill="none" stroke="#245579" stroke-width="2" marker-end="url(#arrow)"/>
<text x="232" y="491" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#20334a" font-weight="normal" text-anchor="start">analyze</text>
<path d="M400,213 H600" fill="none" stroke="#245579" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="500" y="180" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#20334a" font-weight="normal" text-anchor="middle">implement</text>
<path d="M400,398 H600" fill="none" stroke="#245579" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="500" y="365" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#20334a" font-weight="normal" text-anchor="middle">test mapping</text>
<path d="M400,583 H600" fill="none" stroke="#245579" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="500" y="550" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#20334a" font-weight="normal" text-anchor="middle">confront measurement</text>
<path d="M785,270 V340" fill="none" stroke="#245579" stroke-width="2" marker-end="url(#arrow)"/>
<text x="802" y="306" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#20334a" font-weight="normal" text-anchor="start">execute</text>
<path d="M785,455 V525" fill="none" stroke="#245579" stroke-width="2" marker-end="url(#arrow)"/>
<text x="802" y="491" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#20334a" font-weight="normal" text-anchor="start">interpret</text>
<path d="M785,640 V682 H10 V395 H30" fill="none" stroke="#245579" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="500" y="708" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#20334a" font-weight="normal" text-anchor="middle">revise after failure</text>
<rect x="30" y="155" width="370" height="115" rx="9" fill="#eef5fb" stroke="#afc4d5"/>
<text x="45" y="183" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#20334a" font-weight="bold" text-anchor="start">Specified problem</text>
<text x="45" y="210" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#20334a" font-weight="normal" text-anchor="start">Define legal inputs and what counts</text>
<text x="45" y="232" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#20334a" font-weight="normal" text-anchor="start">as an answer.</text>
<rect x="30" y="340" width="370" height="115" rx="9" fill="#eef5fb" stroke="#afc4d5"/>
<text x="45" y="368" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#20334a" font-weight="bold" text-anchor="start">Representation and algorithm</text>
<text x="45" y="395" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#20334a" font-weight="normal" text-anchor="start">Choose encoding, transitions and an</text>
<text x="45" y="417" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#20334a" font-weight="normal" text-anchor="start">output rule.</text>
<rect x="30" y="525" width="370" height="115" rx="9" fill="#eef5fb" stroke="#afc4d5"/>
<text x="45" y="553" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#20334a" font-weight="bold" text-anchor="start">Resource prediction</text>
<text x="45" y="580" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#20334a" font-weight="normal" text-anchor="start">Account for material, timing and</text>
<text x="45" y="602" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#20334a" font-weight="normal" text-anchor="start">expected error.</text>
<rect x="600" y="155" width="370" height="115" rx="9" fill="#f2f7f2" stroke="#afc4d5"/>
<text x="615" y="183" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#20334a" font-weight="bold" text-anchor="start">Molecular construction</text>
<text x="615" y="210" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#20334a" font-weight="normal" text-anchor="start">Specify strands, operations and</text>
<text x="615" y="232" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#20334a" font-weight="normal" text-anchor="start">physical assumptions.</text>
<rect x="600" y="340" width="370" height="115" rx="9" fill="#f2f7f2" stroke="#afc4d5"/>
<text x="615" y="368" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#20334a" font-weight="bold" text-anchor="start">Controlled experiment</text>
<text x="615" y="395" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#20334a" font-weight="normal" text-anchor="start">Record controls, conditions and raw</text>
<text x="615" y="417" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#20334a" font-weight="normal" text-anchor="start">observations.</text>
<rect x="600" y="525" width="370" height="115" rx="9" fill="#f2f7f2" stroke="#afc4d5"/>
<text x="615" y="553" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#20334a" font-weight="bold" text-anchor="start">Claim with limits</text>
<text x="615" y="580" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#20334a" font-weight="normal" text-anchor="start">State only what the measured</text>
<text x="615" y="602" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#20334a" font-weight="normal" text-anchor="start">experiment supports.</text>
<text x="30" y="744" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#245579" font-weight="bold" text-anchor="start">Solid: data / dependency     Dashed: control / review</text>
<text x="30" y="772" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#20334a" font-weight="normal" text-anchor="start">READING: Unexpected products feed back into the construction and abstraction; preserve the failed</text>
<text x="30" y="795" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#20334a" font-weight="normal" text-anchor="start">record.</text>
<text x="30" y="818" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#20334a" font-weight="normal" text-anchor="start">BOUNDARY: An attractive simulation without physical controls is not an experimental demonstration.</text>
<text x="30" y="898" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#20334a" font-weight="normal" text-anchor="start">Conceptual map. No measured superiority or physical validation is implied by an arrow.</text>
</svg>
