<svg xmlns="http://www.w3.org/2000/svg" width="900" height="486" viewBox="0 0 900 486" role="img" aria-labelledby="title desc"><title id="title">DNAD-02-F5: A tube is a multiset, not a search tree</title><desc id="desc">What is parallel and what is sampled? Equal reagent amounts do not imply uniform routes.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#176CA4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><rect x="15" y="20" width="405" height="90" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="31" y="55" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">DIGITAL INVENTORY</text><text x="31" y="95" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">Each legal bounded walk once</text><rect x="465" y="20" width="420" height="90" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="481" y="55" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">PHYSICAL POPULATION</text><text x="481" y="95" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">Unequal copies coexist</text><text x="40" y="160" font-size="24" font-weight="normal" text-anchor="start" fill="#18344A">0 1 2 3 4 5 6</text><text x="480" y="143" font-size="20" font-weight="normal" text-anchor="start" fill="#18344A">0 1 2 3 4 5 6</text><text x="490" y="190" font-size="20" font-weight="normal" text-anchor="start" fill="#AD3346">absent in this illustrative tube</text><text x="40" y="265" font-size="24" font-weight="normal" text-anchor="start" fill="#18344A">0 1 3 4 5 6</text><text x="480" y="248" font-size="20" font-weight="normal" text-anchor="start" fill="#18344A">0 1 3 4 5 6</text><circle cx="505" cy="288" r="13" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="505" y="296" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4"></text><circle cx="575" cy="288" r="13" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="575" y="296" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4"></text><circle cx="645" cy="288" r="13" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="645" y="296" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4"></text><circle cx="715" cy="288" r="13" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="715" y="296" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4"></text><text x="40" y="370" font-size="24" font-weight="normal" text-anchor="start" fill="#18344A">0 3 2 3 4 5 6</text><text x="480" y="353" font-size="20" font-weight="normal" text-anchor="start" fill="#18344A">0 3 2 3 4 5 6</text><circle cx="505" cy="393" r="13" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="505" y="401" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4"></text><circle cx="575" cy="393" r="13" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="575" y="401" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4"></text><text x="450" y="465" font-size="19" font-weight="normal" text-anchor="middle" fill="#5B6874">The tube is hypothetical. Selection cannot recover an absent candidate.</text></g></svg>
