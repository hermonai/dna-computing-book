<svg xmlns="http://www.w3.org/2000/svg" width="900" height="651" viewBox="0 0 900 651" role="img" aria-labelledby="title desc"><title id="title">DNAD-03-F12: From complexity back to molecules</title><desc id="desc">Computational hardness and engineering feasibility answer different questions. No new universal molecular lower bound is asserted.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#176CA4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="450" y="35" font-size="23" font-weight="bold" text-anchor="middle" fill="#18344A">The same symbolic state need not mean the same physical population</text><text x="450" y="87" font-size="25" font-weight="bold" text-anchor="middle" fill="#18344A">One Boolean entry: D[S,v] = true</text><path d="M450,108 L250,162" fill="none" stroke="#176CA4" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/><path d="M450,108 L650,162" fill="none" stroke="#176CA4" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/><path d="M180,183 L180,278 Q250,353 320,278 L320,183" fill="#EDF5FA" stroke="#5B6874" stroke-width="3"/><path d="M175,183 L325,183" fill="none" stroke="#5B6874" stroke-width="3"/><path d="M207,213 q12,-13 24,0 t24,0" fill="none" stroke="#176CA4" stroke-width="3"/><text x="250" y="358" font-size="18" font-weight="bold" text-anchor="middle" fill="#18344A">one surviving copy</text><path d="M580,183 L580,278 Q650,353 720,278 L720,183" fill="#EDF5FA" stroke="#5B6874" stroke-width="3"/><path d="M575,183 L725,183" fill="none" stroke="#5B6874" stroke-width="3"/><path d="M607,213 q12,-13 24,0 t24,0" fill="none" stroke="#176CA4" stroke-width="3"/><path d="M635,240 q12,-13 24,0 t24,0" fill="none" stroke="#28764A" stroke-width="3"/><path d="M663,213 q12,-13 24,0 t24,0" fill="none" stroke="#176CA4" stroke-width="3"/><text x="650" y="358" font-size="18" font-weight="bold" text-anchor="middle" fill="#18344A">many copies, same state</text><text x="450" y="395" font-size="21" font-weight="normal" text-anchor="middle" fill="#18344A">The state records existence, not abundance, yield or reaction history.</text><path d="M145,447 L365,447" fill="none" stroke="#176CA4" stroke-width="5"/><path d="M145,519 L365,519" fill="none" stroke="#28764A" stroke-width="5"/><path d="M172.5,447 L172.5,460" fill="none" stroke="#176CA4" stroke-width="2"/><rect x="156.5" y="456" width="32" height="25" rx="8" fill="#DDEFFC" stroke="#176CA4" stroke-width="1.5"/><text x="172.5" y="476" font-size="17" font-weight="bold" text-anchor="middle" fill="#18344A">A</text><rect x="156.5" y="484" width="32" height="25" rx="8" fill="#E0F1E4" stroke="#28764A" stroke-width="1.5"/><text x="172.5" y="503" font-size="17" font-weight="bold" text-anchor="middle" fill="#18344A">T</text><path d="M172.5,481 L172.5,484" fill="none" stroke="#5B6874" stroke-width="2" stroke-dasharray="8 6"/><path d="M172.5,509 L172.5,519" fill="none" stroke="#28764A" stroke-width="2"/><path d="M227.5,447 L227.5,460" fill="none" stroke="#176CA4" stroke-width="2"/><rect x="211.5" y="456" width="32" height="25" rx="8" fill="#DDEFFC" stroke="#176CA4" stroke-width="1.5"/><text x="227.5" y="476" font-size="17" font-weight="bold" text-anchor="middle" fill="#18344A">C</text><rect x="211.5" y="484" width="32" height="25" rx="8" fill="#E0F1E4" stroke="#28764A" stroke-width="1.5"/><text x="227.5" y="503" font-size="17" font-weight="bold" text-anchor="middle" fill="#18344A">G</text><path d="M227.5,481 L227.5,484" fill="none" stroke="#5B6874" stroke-width="2" stroke-dasharray="8 6"/><path d="M227.5,509 L227.5,519" fill="none" stroke="#28764A" stroke-width="2"/><path d="M282.5,447 L282.5,460" fill="none" stroke="#176CA4" stroke-width="2"/><rect x="266.5" y="456" width="32" height="25" rx="8" fill="#DDEFFC" stroke="#176CA4" stroke-width="1.5"/><text x="282.5" y="476" font-size="17" font-weight="bold" text-anchor="middl