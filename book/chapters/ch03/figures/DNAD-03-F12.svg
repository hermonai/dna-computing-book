y="523" font-size="18" font-weight="normal" text-anchor="start" fill="#18344A">physical state is not preserved</text><text x="450" y="620" font-size="18" font-weight="normal" text-anchor="middle" fill="#18344A">Pairing and backbone are different; this duplex is a schematic, not a designed reagent.</text></g></svg>
