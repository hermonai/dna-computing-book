<svg xmlns="http://www.w3.org/2000/svg" width="900" height="615" viewBox="0 0 900 615" role="img" aria-labelledby="title desc"><title id="title">DNAD-03-F11: Reduction claims have three proof obligations</title><desc id="desc">A plausible drawing is not a reduction proof. Testing finite cases cannot replace proof.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#176CA4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="450" y="35" font-size="26" font-weight="bold" text-anchor="middle" fill="#18344A">Open the cycle, then prove both directions</text><circle cx="130" cy="155" r="25" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="130" y="163" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">0</text><path d="M186,155 L398,155" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><circle cx="430" cy="155" r="25" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="430" y="163" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">1</text><path d="M486,155 L698,155" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><circle cx="730" cy="155" r="25" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="730" y="163" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">2</text><circle cx="130" cy="350" r="25" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="130" y="358" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">s</text><path d="M186,350 L308,350" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><circle cx="340" cy="350" r="25" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="340" y="358" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">1</text><path d="M396,350 L518,350" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><circle cx="550" cy="350" r="25" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="550" y="358" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">2</text><path d="M606,350 L728,350" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><circle cx="760" cy="350" r="25" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="760" y="358" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">t</text><path d="M730,181 L730,221" fill="none" stroke="#176CA4" stroke-width="3"/><path d="M730,221 L130,221" fill="none" stroke="#176CA4" stroke-width="3"/><path d="M130,221 L130,183" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><path d="M450,245 L450,307" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><text x="465" y="276" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">split pivot 0</text><text x="450" y="411" font-size="23" font-weight="bold" text-anchor="middle" fill="#18344A">Open: cycle ⇒ s–t path       Close: s–t path ⇒ cycle</text><rect x="40" y="452" width="820" height="126" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="60" y="490" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">Size: n becomes n+1; each original edge is redirected once.</text><text x="60" y="519" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">Forward and backward implications preserve existence.</text><text x="60" y="548" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">Finite tests detect bugs; the argument establishes the general map.</text></g></svg>
