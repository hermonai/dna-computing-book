<svg xmlns="http://www.w3.org/2000/svg" width="900" height="610" viewBox="0 0 900 610" role="img" aria-labelledby="title desc"><title id="title">DNAD-03-F1: Checking is not finding</title><desc id="desc">A verified path proves existence; a failed candidate does not prove absence. Do not label rejected candidate as a no-instance.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#176CA4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><rect x="20" y="20" width="370" height="110" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="36" y="55" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">INSTANCE</text><text x="36" y="95" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">Directed graph G</text><text x="36" y="124" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">Fixed endpoints s and t</text><rect x="510" y="20" width="370" height="110" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="526" y="55" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">CERTIFICATE</text><text x="526" y="95" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">One proposed vertex order</text><text x="526" y="124" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">Length n; labels are explicit</text><path d="M210,130 L340,190" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><path d="M695,130 L560,190" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><rect x="205" y="190" width="490" height="140" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="221" y="225" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">DETERMINISTIC VERIFIER</text><text x="221" y="265" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">Endpoints + every vertex exactly once</text><text x="221" y="294" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">Every consecutive pair is a graph edge</text><path d="M330,330 L210,385" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><path d="M570,330 L690,385" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><rect x="20" y="385" width="405" height="145" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="36" y="420" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">ACCEPT</text><text x="36" y="460" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">This order is a witness.</text><text x="36" y="489" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">Therefore this instance is YES.</text><rect x="470" y="385" width="410" height="145" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="486" y="420" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">REJECT</text><text x="486" y="460" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">This order fails.</text><text x="486" y="489" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">Another order may still succeed.</text><text x="450" y="575" font-size="22" font-weight="normal" text-anchor="middle" fill="#18344A">A rejected certificate is not a proof that no witness exists.</text></g></svg>
