<svg xmlns="http://www.w3.org/2000/svg" width="900" height="695" viewBox="0 0 900 695" role="img" aria-labelledby="title desc"><title id="title">DNAD-03-F3: A cycle becomes a fixed-endpoint path</title><desc id="desc">Both directions preserve existence and the transformation is polynomial. The transformation does not solve either problem.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#176CA4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="450" y="35" font-size="24" font-weight="bold" text-anchor="middle" fill="#18344A">Split the pivot: incoming arcs end; outgoing arcs begin</text><text x="25" y="85" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">Example cycle</text><path d="M169,180 L418,180" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><path d="M479,180 L728,180" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><path d="M760,209 L760,265" fill="none" stroke="#176CA4" stroke-width="3"/><path d="M760,265 L140,265" fill="none" stroke="#176CA4" stroke-width="3"/><path d="M140,265 L140,212" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><circle cx="140" cy="180" r="25" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="140" y="188" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">0</text><circle cx="450" cy="180" r="25" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="450" y="188" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">1</text><circle cx="760" cy="180" r="25" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="760" y="188" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">2</text><text x="140" y="135" font-size="21" font-weight="normal" text-anchor="middle" fill="#18344A">pivot</text><text x="25" y="335" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">Fixed-endpoint path after splitting vertex 0</text><circle cx="120" cy="405" r="25" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="120" y="413" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">s</text><path d="M151,405 L308,405" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><circle cx="340" cy="405" r="25" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="340" y="413" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">1</text><path d="M371,405 L528,405" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><circle cx="560" cy="405" r="25" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="560" y="413" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">2</text><path d="M591,405 L748,405" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><circle cx="780" cy="405" r="25" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="780" y="413" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">t</text><text x="120" y="460" font-size="20" font-weight="normal" text-anchor="middle" fill="#18344A">no incoming arcs</text><text x="780" y="460" font-size="20" font-weight="normal" text-anchor="middle" fill="#18344A">no outgoing arcs</text><rect x="20" y="505" width="860" height="120" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="36" y="540" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">BOTH DIRECTIONS MATTER</text><text x="36" y="580" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">Open a Hamiltonian cycle at the pivot to obtain an s–t path.</text><text x="36" y="609" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">Identify s and t to close a Hamiltonian path into a cycle.</text><text x="450" y="665" font-size="21" font-weight="normal" text-anchor="middle" fill="#18344A">The reduction transforms an instance; it does not find the cycle.</text></g></svg>
