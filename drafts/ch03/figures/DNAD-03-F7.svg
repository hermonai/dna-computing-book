<svg xmlns="http://www.w3.org/2000/svg" width="900" height="725" viewBox="0 0 900 725" role="img" aria-labelledby="title desc"><title id="title">DNAD-03-F7: P, NP and coNP: track the quantifier</title><desc id="desc">Polynomial verification of yes certificates does not supply no certificates. Do not draw P as a proven strict subset of NP.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#176CA4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="450" y="35" font-size="25" font-weight="bold" text-anchor="middle" fill="#18344A">Negate the existence claim, not one verifier result</text><rect x="20" y="85" width="410" height="300" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="35" y="123" font-size="21" font-weight="bold" text-anchor="start" fill="#18344A">YES: at least one witness</text><circle cx="75" cy="202" r="27" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="75" y="210" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">P1</text><path d="M75,230 L75,273" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><text x="75" y="311" font-size="19" font-weight="bold" text-anchor="middle" fill="#5B6874">NO</text><circle cx="172" cy="202" r="27" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="172" y="210" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">P2</text><path d="M172,230 L172,273" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><text x="172" y="311" font-size="19" font-weight="bold" text-anchor="middle" fill="#28764A">YES</text><circle cx="269" cy="202" r="27" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="269" y="210" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">P3</text><path d="M269,230 L269,273" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><text x="269" y="311" font-size="19" font-weight="bold" text-anchor="middle" fill="#5B6874">NO</text><circle cx="366" cy="202" r="27" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="366" y="210" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">P4</text><path d="M366,230 L366,273" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><text x="366" y="311" font-size="19" font-weight="bold" text-anchor="middle" fill="#5B6874">NO</text><text x="225" y="360" font-size="22" font-weight="normal" text-anchor="middle" fill="#18344A">∃P R(G,s,t,P)</text><rect x="470" y="85" width="410" height="300" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="485" y="123" font-size="21" font-weight="bold" text-anchor="start" fill="#18344A">NO: every candidate fails</text><circle cx="525" cy="202" r="27" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="525" y="210" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">P1</text><path d="M525,230 L525,273" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><text x="525" y="311" font-size="19" font-weight="bold" text-anchor="middle" fill="#5B6874">NO</text><circle cx="622" cy="202" r="27" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="622" y="210" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">P2</text><path d="M622,230 L622,273" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><text x="622" y="311" font-size="19" font-weight="bold" text-anchor="middle" fill="#5B6874">NO</text><circle cx="719" cy="202" r="27" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="719" y="210" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">P3</text><path d="M719,230 L719,273" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><text x="719" y="311" font-size="19" font-weight="bold" text-anchor="middle" fill="#5B6874">NO</text><circle cx="816" cy="202" r="27" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="816" y="210" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">P4</text><path d="M816,230 L816,273" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><text x="816" y="311" font-size="19" font-weight="bold" text-anchor="middle" fill="#5B6874">NO</text><text x="675" y="360" font-size="22" font-weight="normal" text-anchor="middle" fill="#18344A">∀P ¬R(G,s,t,P)</text><text x="450" y="422" font-size="19" font-weight="normal" text-anchor="middle" fill="#18344A">Four candidate slots illustrate quantifiers; they are not the toy graph&#x27;s full search.</text><rect x="20" y="461" width="860" height="180" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="40" y="500" font-size="22" font-weight="bold" text-anchor="start" fill="#18344A">CLASS DEFINITIONS, NOT A SEPARATION DIAGRAM</text><text x="40" y="540" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">P: decide membership in polynomial time.</text><text x="40" y="569" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">NP: a polynomial-length YES certificate can be checked in polynomial time.</text><text x="40" y="598" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">coNP: the complement language belongs to NP.</text><text x="450" y="691" font-size="22" font-weight="normal" text-anchor="middle" fill="#18344A">P ⊆ NP ∩ coNP. No strict inclusion or class separation is asserted.</text></g></svg>
