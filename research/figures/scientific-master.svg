<svg xmlns="http://www.w3.org/2000/svg" width="900" height="610" viewBox="0 0 900 610" role="img" aria-labelledby="title desc"><title id="title">DNA-MASTER: From molecular recognition to a computational claim</title><desc id="desc">5′ ACGT 3′ pairs with aligned 3′ TGCA 5′; suitable nick → ligase-dependent seal.
Physical association / ligation ⇢ symbolic matching / concatenation ⇢ algorithm.
The abstraction omits concentration, kinetics, mismatch, yield and readout limits. Original schematic; not to scale; research branches are proposed.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#176CA4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="450" y="38" font-size="25" font-weight="bold" text-anchor="middle" fill="#18344A">From molecular recognition to a computational claim</text><text x="450" y="73" font-size="18" font-weight="normal" text-anchor="middle" fill="#18344A">Mechanistic schematic: four bases illustrate orientation, not an oligo design.</text><text x="160" y="118" font-size="19" font-weight="bold" text-anchor="middle" fill="#18344A">TWO FRAGMENTS</text><text x="455" y="118" font-size="19" font-weight="bold" text-anchor="middle" fill="#18344A">NICKED DUPLEX</text><text x="750" y="118" font-size="19" font-weight="bold" text-anchor="middle" fill="#18344A">SEALED BACKBONE</text><path d="M55,165 L147.0,165" fill="none" stroke="#176CA4" stroke-width="5"/><path d="M163.0,165 L255,165" fill="none" stroke="#176CA4" stroke-width="5"/><path d="M80.0,165 L80.0,178" fill="none" stroke="#176CA4" stroke-width="2"/><rect x="64.0" y="174" width="32" height="25" rx="8" fill="#DDEFFC" stroke="#176CA4" stroke-width="1.5"/><text x="80.0" y="194" font-size="17" font-weight="bold" text-anchor="middle" fill="#18344A">A</text><path d="M130.0,165 L130.0,178" fill="none" stroke="#176CA4" stroke-width="2"/><rect x="114.0" y="174" width="32" height="25" rx="8" fill="#DDEFFC" stroke="#176CA4" stroke-width="1.5"/><text x="130.0" y="194" font-size="17" font-weight="bold" text-anchor="middle" fill="#18344A">C</text><path d="M180.0,165 L180.0,178" fill="none" stroke="#176CA4" stroke-width="2"/><rect x="164.0" y="174" width="32" height="25" rx="8" fill="#DDEFFC" stroke="#176CA4" stroke-width="1.5"/><text x="180.0" y="194" font-size="