l="#18344A">5′</text><path d="M645,165 L845,165" fill="none" stroke="#176CA4" stroke-width="5"/><path d="M645,237 L845,237" fill="none" stroke="#28764A" stroke-width="5"/><path d="M670.0,165 L670.0,178" fill="none" stroke="#176CA4" stroke-width="2"/><rect x="654.0" y="174" width="32" height="25" rx="8" fill="#DDEFFC" stroke="#176CA4" stroke-width="1.5"/><text x="670.0" y="194" font-size="17" font-weight="bold" text-anchor="middle" fill="#18344A">A</text><rect x="654.0" y="202" width="32" height="25" rx="8" fill="#E0F1E4" stroke="#28764A" stroke-width="1.5"/><text x="670.0" y="221" font-size="17" font-weight="bold" text-anchor="middle" fill="#18344A">T</text><path d="M670.0,199 L670.0,202" fill="none" stroke="#5B6874" stroke-width="2" stroke-dasharray="8 6"/><path d="M670.0,227 L670.0,237" fill="none" stroke="#28764A" stroke-width="2"/><path d="M720.0,165 L720.0,178" fill="none" stroke="#176CA4" stroke-width="2"/><rect x="704.0" y="174" width="32" height="25" rx="8" fill="#DDEFFC" stroke="#176CA4" stroke-width="1.5"/><text x="720.0" y="194" font-size="17" font-weight="bold" text-anchor="middle" fill="#18344A">C</text><rect x="704.0" y="202" width="32" height="25" rx="8" fill="#E0F1E4" stroke="#28764A" stroke-width="1.5"/><text x="720.0" y="221" font-size="17" font-weight="bold" text-anchor="middle" fill="#18344A">G</text><path d="M720.0,199 L720.0,202" fill="none" stroke="#5B6874" stroke-width="2" stroke-dasharray="8 6"/><path d="M720.0,227 L720.0,237" fill="none" stroke="#28764A" stroke-width="2"/><path d="M770.0,165 L770.0,178" fill="none" stroke="#176CA4" stroke-width="2"/><rect x="754.0" y="174" width="32" height="25" rx="8" fill="#DDEFFC" stroke="#176CA4" stroke-width="1.5"/><text x="770.0" y="194" font-size="17" font-weight="bold" text-anchor="middle" fill="#18344A">G</text><rect x="754.0" y="202" width="32" height="25" rx="8" fill="#E0F1E4" stroke="#28764A" stroke-width="1.5"/><text x="770.0" y="221" font-size="17" font-weight="bold" text-anchor="middle" fill="#18344A">C</text><path d="M770.0,199 L770.0,202" fill="none" stroke="#5B6874" stroke-width="2" stroke-dasharray="8 6"/><path d="M770.0,227 L770.0,237" fill="none" stroke="#28764A" stroke-width="2"/><path d="M820.0,165 L820.0,178" fill="none" stroke="#176CA4" stroke-width="2"/><rect x="804.0" y="174" width="32" height="25" rx="8" fill="#DDEFFC" stroke="#176CA4" stroke-width="1.5"/><text x="820.0" y="194" font-size="17" font-weight="bold" text-anchor="middle" fill="#18344A">T</text><rect x="804.0" y="202" width="32" height="25" rx="8" fill="#E0F1E4" stroke="#28764A" stroke-width="1.5"/><text x="820.0" y="221" font-size="17" font-weight="bold" text-anchor="middle" fill="#18344A">A</text><path d="M820.0,199 L820.0,202" fill="none" stroke="#5B6874" stroke-width="2" stroke-dasharray="8 6"/><path d="M820.0,227 L820.0,237" fill="none" stroke="#28764A" stroke-width="2"/><text x="621" y="170" font-size="17" font-weight="normal" text-anchor="start" fill="#18344A">5′</text><text x="854" y="170" font-size="17" font-weight="normal" text-anchor="start" fill="#18344A">3′</text><text x="621" y="242" font-size="17" font-weight="normal" text-anchor="start" fill="#18344A">3′</text><text x="854" y="242" font-size="17" font-weight="normal" text-anchor="start" fill="#18344A">5′</text><path d="M285,190 L315,190" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><path d="M580,190 L610,190" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><path d="M405,286 C392,255 432,243 450,258 C481,237 510,273 489,296 C498,329 457,333 443,314 C418,335 389,308 405,286 Z" fill="#F8E5AE" stroke="#967229" stroke-width="2"/><text x="450" y="291" font-size="17" font-weight="bold" text-anchor="middle" fill="#18344A">ligase</text><path d="M450,248 L450,184" fill="none" stroke="#176CA4" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="65" y="277" font-size="18" font-weight="normal" text-anchor="start" fill="#18344A">Pairing is selective,</text><text x="65" y="303" font-size="18" font-weight="normal" text-anchor="start" fill="#18344A">not perfectly specific.</text><text x="636" y="277" font-size="18" font-weight="normal" text-anchor="start" fill="#18344A">A suitable nick can</text><text x="636" y="303" font-size="18" font-weight="normal" text-anchor="start" fill="#18344A">be covalently sealed.</text><text x="450" y="348" font-size="20" font-weight="normal" text-anchor="middle" fill="#18344A">Conditions, substrate chemistry and enzymes constrain which transitions occur.</text><rect x="20" y="392" width="260" height="135" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="35" y="427" font-size="18" font-weight="bold" text-anchor="start" fill="#18344A">MOLECULAR OPERATOR</text><text x="35" y="466" font-size="18" font-weight="normal" text-anchor="start" fill="#18344A">Association / ligation</text><text x="35" y="492" font-size="18" font-weight="normal" text-anchor="start" fill="#18344A">yield, mismatch, kinetics</text><path d="M284,457 L314,457" fill="none" stroke="#176CA4" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/><rect x="320" y="392" width="260" height="135" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="335" y="427" font-size="18" font-weight="bold" text-anchor="start" fill="#18344A">FORMAL PRIMITIVE</text><text x="335" y="466" font-size="18" font-weight="normal" text-anchor="start" fill="#18344A">Match / concatenate</text><text x="335" y="492" font-size="18" font-weight="normal" text-anchor="start" fill="#18344A">specified symbolic rule</text><path d="M584,457 L614,457" fill="none" stroke="#176CA4" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/><rect x="620" y="392" width="260" height="135" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="635" y="427" font-size="18" font-weight="bold" text-anchor="start" fill="#18344A">ALGORITHM + EVIDENCE</text><text x="635" y="466" font-size="18" font-weight="normal" text-anchor="start" fill="#18344A">Generate / filter / verify</text><text x="635" y="492" font-size="18" font-weight="normal" text-anchor="start" fill="#18344A">sample, measure, interpret</text><text x="450" y="569" font-size="19" font-weight="normal" text-anchor="middle" fill="#18344A">Dashed bridge = abstraction, not biochemical identity or guaranteed execution.</text></g></svg>
